ort.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 15, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "mcq", "k": 1, "q": "Computer technology is changing at a __________ pace.", "o": [["A", "slow"], ["B", "slow to medium"], ["C", "rapid"], ["D", "non-existent"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 16, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "mcq", "k": 2, "q": "Computer _________ refers to those attributes that have a direct impact on the logical execution of a program.", "o": [["A", "organization"], ["B", "specifics"], ["C", "design"], ["D", "architecture"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 17, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "mcq", "k": 3, "q": "Architectural attributes include __________.", "o": [["A", "I/O mechanisms"], ["B", "control signals"], ["C", "interfaces"], ["D", "memory technology used"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 18, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "mcq", "k": 4, "q": "_________ attributes include hardware details transparent to the programmer.", "o": [["A", "Interface"], ["B", "Organizational"], ["C", "Memory"], ["D", "Architectural"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 19, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "mcq", "k": 5, "q": "It is a(n) _________ design issue whether a computer will have a multiply instruction.", "o": [["A", "architectural"], ["B", "memory"], ["C", "elementary"], ["D", "organizational"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 20, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "mcq", "k": 6, "q": "It is a(n) _________ issue whether the multiply instruction will be implemented by a special multiply unit or by a mechanism that makes repeated use of the add unit of the system.", "o": [["A", "architectural"], ["B", "memory"], ["C", "mechanic s to which all the other components attach.", "o": [], "a": "system bus", "x": "", "n": "", "r": "", "s": 0}, {"id": 42, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "fib", "k": 13, "q": "The major structural components of the CPU are: control unit, register, CPU interconnection, and _____.", "o": [], "a": "ALU", "x": "", "n": "", "r": "", "s": 0}, {"id": 43, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "fib", "k": 14, "q": "A _____ control unit operates by executing microinstructions that define the functionality of the control unit.", "o": [], "a": "microprogrammed", "x": "", "n": "", "r": "", "s": 0}, {"id": 44, "sec": "Chapter 1: Basic Concepts and Computer Evolution", "t": "fib", "k": 15, "q": "The _____ controls the operation of the CPU and hence the computer.", "o": [], "a": "control unit", "x": "", "n": "", "r": "", "s": 0}, {"id": 45, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 1, "q": "Year by year the cost of computer systems continues to rise.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 46, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 2, "q": "Processors are so inexpensive that we now have microprocessors we throw away.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 47, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 3, "q": "Workstation systems cannot support highly sophisticated engineering and scientific applications.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 48, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 4, "q": "The IAS is the prototype of all subsequent general-purpose computers.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 49, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 5, "q": "Cloud service providers use massive high-performance banks of for a servers to satisfy high-volume,high-transaction-rate applications broad spectrum of clients.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 50, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 6, "q": "The raw speed of the microprocessor will not achieve its potential unless it is fed a constant stream of work to do in the form of computer instructions.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 51, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 7, "q": "Superscalar execution is the same principle as seen in an assembly line.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 52, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 8, "q": "Branch prediction potentially increases the amount of work available for the processor to execute.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 53, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 9, "q": "Raw speed is far more important than how a processor performs when executing a given application.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 54, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 10, "q": "The cache holds recently accessed data.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 55, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 11, "q": "Operations performed by a processor, such as fetching an instruction, decoding the instruction, performing an arithmetic operation, and so on, are governed by a system clock.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 56, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 12, "q": "A common measure of performance for a processor is the rate at which instructions are executed, expressed as millions of instructions per second (MIPS).", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 57, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 13, "q": "Designers wrestle with the challenge of balancing processor performance with that of main memory and other computer components.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 58, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 14, "q": "A straight comparison of clock speeds on different processors tells the whole story about performance.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 59, "sec": "Chapter 2: Performance Issues", "t": "tf", "k": 15, "q": "Measures such as MIPS and MFLOPS have proven adequate to evaluating the performanceof processors.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 60, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 1, "q": "Multiple parallel pipelines are used in __________.", "o": [["A", "speculative execution"], ["B", "data flow analysis"], ["C", "superscalar execution"], ["D", "branch prediction"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 61, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 2, "q": "The desktop application(s) that require the great power of today’s microprocessor- based systems include___________.", "o": [["A", "image processing"], ["B", "speech recognition"], ["C", "videoconferencing"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 62, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 3, "q": "___________ potentially increases the amount of work available for the processor to execute.", "o": [["A", "Branch prediction"], ["B", "Performance balance"], ["C", "Pipelining"], ["D", "BIPS"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 63, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 4, "q": "The interface between processor and ___________ is the most crucial pathway in the entire computer because it is responsible for carrying a constant flow of program instructions and data between memory chips and the processor.", "o": [["A", "main memory"], ["B", "pipeline"], ["C", "clock speed"], ["D", "control unit"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 64, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 5, "q": "The __________ is a relatively small fast memory interposed between a larger, slower memory and the logic that accesses the larger memory.", "o": [["A", "peripheral"], ["B", "cache"], ["C", "processor"], ["D", "arithmetic and logic unit"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 65, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 6, "q": "An increase in clock rate means that individual operations are executed _____.", "o": [["A", "the same"], ["B", "slower"], ["C", "with very little change"], ["D", "more rapidly"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 66, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 7, "q": "A __________ is a core designed to perform parallel operations on graphics data.", "o": [["A", "MIC"], ["B", "ALU"], ["C", "GPU"], ["D", "PGD"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 67, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 8, "q": "A(n) __________ Mean is a good candidate for comparing the execution time performance of several systems.", "o": [["A", "Composite"], ["B", "Arithmetic"], ["C", "Harmonic"], ["D", "Evaluation"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 68, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 9, "q": "__________ law deals with the potential speedup of a program using multiple processors compared to a single processor.", "o": [["A", "Moore’s"], ["B", "Amdahl’s"], ["C", "Little’s"], ["D", "Murphy’s"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 69, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 10, "q": "One increment, or pulse, of a clock is referred to as a __________.", "o": [["A", "clock cycle"], ["B", "clock rate"], ["C", "clock speed"], ["D", "cycle time"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 70, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 11, "q": "The use of multiple processors on the same chip is referred to as __________ and provides the potential to increase performance without increasing the clock rate.", "o": [["A", "multicore"], ["B", "GPU"], ["C", "data channels"], ["D", "MPC"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 71, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 12, "q": "With respect to changes in values, the __________ Mean gives equal weight to all of the values in the data set.", "o": [["A", "Harmonic"], ["B", "Arithmetic"], ["C", "Composite"], ["D", "Geometric"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 72, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 13, "q": "The __________ measures the ability of a computer to complete a single task.", "o": [["A", "clock speed"], ["B", "speed metric"], ["C", "execute cycle"], ["D", "cycle time"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 73, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 14, "q": "A measurement of how many tasks a computer can accomplish in a certain amount of time is called a(n) __________.", "o": [["A", "real-time system"], ["B", "application analysis"], ["C", "cycle speed"], ["D", "throughput"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 74, "sec": "Chapter 2: Performance Issues", "t": "mcq", "k": 15, "q": "The best known of the SPEC benchmark suites is __________.", "o": [["A", "SPEC CPU2006"], ["B", "SPECjvm2008"], ["C", "SPECsfs2008"], ["D", "SPEC SC2013"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 75, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 1, "q": "_____ enables a processor to work simultaneously on multiple instructions by performing a different phase for each of the multiple instructions at the same time.", "o": [], "a": "Pipelining", "x": "", "n": "", "r": "", "s": 0}, {"id": 76, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 2, "q": "_____ is the ability to issue more than one instruction in every processor clock cycle.", "o": [], "a": "Superscalar execution", "x": "", "n": "", "r": "", "s": 0}, {"id": 77, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 3, "q": "_____: the processor looks ahead in the instruction code fetched from memory and predicts which branches, or groups of instructions, are likely to be processed next.", "o": [], "a": "Branch prediction", "x": "", "n": "", "r": "", "s": 0}, {"id": 78, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 4, "q": "_____ enables the processor to keep its execution engines as busy as possible by executing instructions that are likely to be needed.", "o": [], "a": "Speculative execution", "x": "", "n": "", "r": "", "s": 0}, {"id": 79, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 5, "q": "Traditionally found on a plug-in graphics card, a _____ is used to encode and render 2D and 3D graphics as well as process video.", "o": [], "a": "GPU", "x": "", "n": "", "r": "", "s": 0}, {"id": 80, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 6, "q": "_____ Law applies to a queuing system.", "o": [], "a": "Little's", "x": "", "n": "", "r": "", "s": 0}, {"id": 81, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 7, "q": "The three common formulas used for calculating a mean are arithmetic, harmonic, and _____.", "o": [], "a": "geometric", "x": "", "n": "", "r": "", "s": 0}, {"id": 82, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 8, "q": "The _____ Mean used for a time-based variable, such as program execution time, has the important property that it is directly proportional to the total time.", "o": [], "a": "Arithmetic", "x": "", "n": "", "r": "", "s": 0}, {"id": 83, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 9, "q": "The _____ Mean is preferred when calculating rates.", "o": [], "a": "Harmonic", "x": "", "n": "", "r": "", "s": 0}, {"id": 84, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 10, "q": "The _____ Mean gives consistent results regardless of which system is used as a reference.", "o": [], "a": "geometric", "x": "", "n": "", "r": "", "s": 0}, {"id": 85, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 11, "q": "_____ metrics are required for all reported results and have strict guidelines for compilation.", "o": [], "a": "Base", "x": "", "n": "", "r": "", "s": 0}, {"id": 86, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 12, "q": "A _____ suite is a collection of programs, defined in a high-level language, that together attempt to provide a representative test of a computer in a particular application or system programming area.", "o": [], "a": "benchmark", "x": "", "n": "", "r": "", "s": 0}, {"id": 87, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 13, "q": "At the most fundamental level, the speed of a processor is dictated by the pulse frequency produced by the clock, measured in cycles per second, or _____.", "o": [], "a": "Hertz", "x": "", "n": "", "r": "", "s": 0}, {"id": 88, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 14, "q": "The best-known collection of benchmark suites is defined and maintained by an industry consortium known as _____.", "o": [], "a": "SPEC", "x": "", "n": "", "r": "", "s": 0}, {"id": 89, "sec": "Chapter 2: Performance Issues", "t": "fib", "k": 15, "q": "_____ law deals with the potential speedup of a program using multiple processors compared to a single processor.", "o": [], "a": "Amdahl's", "x": "", "n": "", "r": "", "s": 0}, {"id": 90, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 1, "q": "At a top level, a computer consists of CPU, memory, and I/O components.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 91, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 2, "q": "The basic function of a computer is to execute programs.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 92, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 3, "q": "Program execution consists of repeating the process of instruction fetch and instruction execution.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 93, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 4, "q": "Interrupts do not improve processing efficiency.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 94, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 5, "q": "An I/O module cannot exchange data directly with the processor.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 95, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 6, "q": "A key characteristic of a bus is that it is not a shared transmission medium.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 96, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 7, "q": "Computer systems contain a number of different buses that provide pathways between components at various levels of the computer system hierarchy.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 97, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 8, "q": "In general, the more devices attached to the bus, the greater the bus length and hence the greater the propagation delay.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 98, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 9, "q": "It is not possible to connect I/O controllers directly onto the system bus.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 99, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 10, "q": "The method of using the same lines for multiple purposes is known as time multiplexing.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 100, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 11, "q": "Timing refers to the way in which events are coordinated on the bus.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 101, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 12, "q": "With asynchronous timing the occurrence of events on the bus is determined by a clock.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 102, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 13, "q": "Because all devices on a synchronous bus are tied to a fixed clock rate, the system cannot take advantage of advances in device performance.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 103, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 14, "q": "The unit of transfer at the link layer is a phit and the unit transfer at the physical layer is a flit.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 104, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "tf", "k": 15, "q": "A key requirement for PCIe is high capacity to support the needs ofhigher data rate I/O devices such as Gigabit Ethernet.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 105, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 1, "q": "Virtually all contemporary computer designs are based on concepts developed by __________ at the Institute for Advanced Studies, Princeton.", "o": [["A", "John Maulchy"], ["B", "John von Neumann"], ["C", "Herman Hollerith"], ["D", "John Eckert"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 106, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 2, "q": "The von Neumann architecture is based on which concept?", "o": [["A", "data and instructions are stored in a single read-write memory"], ["B", "the contents of this memory are addressable by location"], ["C", "execution occurs in a sequential fashion"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 107, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 3, "q": "A sequence of codes or instructions is called __________.", "o": [["A", "software"], ["B", "memory"], ["C", "an interconnect"], ["D", "a register"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 108, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 4, "q": "The processing required for a single instruction is called a(n) __________ cycle.", "o": [["A", "execute"], ["B", "fetch"], ["C", "instruction"], ["D", "packet"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 109, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 5, "q": "A(n) _________ is generated by a failure such as power failure or memory parity error.", "o": [["A", "I/O interrupt"], ["B", "hardware failure interrupt"], ["C", "timer interrupt"], ["D", "program interrupt"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 110, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 6, "q": "A(n) _________ is generated by some condition that occurs as a result of an instruction execution.", "o": [["A", "timer interrupt"], ["B", "I/O interrupt"], ["C", "program interrupt"], ["D", "hardware failure interrupt"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 111, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 7, "q": "The interconnection structure must support which transfer?", "o": [["A", "memory to processor"], ["B", "processor to memory"], ["C", "I/O to or from memory"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 112, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 8, "q": "A bus that connects major computer components (processor, memory, I/O) is called a __________.", "o": [["A", "system bus"], ["B", "address bus"], ["C", "data bus"], ["D", "control bus"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 113, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 9, "q": "The __________ are used to designate the source or destination of the data on the data bus.", "o": [["A", "system lines"], ["B", "data lines"], ["C", "control lines"], ["D", "address lines"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 114, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 10, "q": "The data lines provide a path for moving data among system modules and are collectively called the _________.", "o": [["A", "control bus"], ["B", "address bus"], ["C", "data bus"], ["D", "system bus"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 115, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 11, "q": "A __________ is the high-level set of rules for exchanging packets of data between devices.", "o": [["A", "bus"], ["B", "protocol"], ["C", "packet"], ["D", "QPI"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 116, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 12, "q": "Each data path consists of a pair of wires (referred to as a __________ ) that transmits data one bit at a time.", "o": [["A", "lane"], ["B", "path"], ["C", "line"], ["D", "bus"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 117, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 13, "q": "The _________ receives read and write requests from the software above the TL and creates request packets for transmission to a destination via the link layer.", "o": [["A", "transaction layer"], ["B", "root layer"], ["C", "configuration layer"], ["D", "transport layer"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 118, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 14, "q": "The TL supports which of the following address spaces?", "o": [["A", "memory"], ["B", "I/O"], ["C", "message"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 119, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "mcq", "k": 15, "q": "The QPI _________ layer is used to determine the course that a packet will traverse across the available system interconnects.", "o": [["A", "link"], ["B", "protocol"], ["C", "routing"], ["D", "physical"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 120, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 1, "q": "A _____ register specifies the address in memory for the next read or write.", "o": [], "a": "memory address (MAR)", "x": "", "n": "", "r": "", "s": 0}, {"id": 121, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 2, "q": "A _____ register contains the data to be written into memory or receives the data read from memory.", "o": [], "a": "memory buffer (MBR)", "x": "", "n": "", "r": "", "s": 0}, {"id": 122, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 3, "q": "The most common classes of interrupts are: program, timer, I/O and _____.", "o": [], "a": "hardware failure", "x": "", "n": "", "r": "", "s": 0}, {"id": 123, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 4, "q": "A(n) _____ interrupt is generated by a timer within the processor and allows the operating system to perform certain functions on a regular basis.", "o": [], "a": "timer", "x": "", "n": "", "r": "", "s": 0}, {"id": 124, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 5, "q": "A(n) _____ interrupt is generated by an I/O controller to signal normal completion of an operation, request service from the processor, or to signal a variety of error conditions.", "o": [], "a": "I/O", "x": "", "n": "", "r": "", "s": 0}, {"id": 125, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 6, "q": "A _____ interrupt simply means that the processor can and will ignore that interrupt request signal.", "o": [], "a": "disabled", "x": "", "n": "", "r": "", "s": 0}, {"id": 126, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 7, "q": "The collection of paths connecting the various modules is called the _____ structure.", "o": [], "a": "interconnection", "x": "", "n": "", "r": "", "s": 0}, {"id": 127, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 8, "q": "A _____ is a communication pathway connecting two or more devices.", "o": [], "a": "bus", "x": "", "n": "", "r": "", "s": 0}, {"id": 128, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 9, "q": "The _____ lines are used to control the access to and the use of the data and address lines.", "o": [], "a": "control", "x": "", "n": "", "r": "", "s": 0}, {"id": 129, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 10, "q": "There are three important groups of DLLPs used in managing a link: flow control packets, _____, and TLP ACK and NAK packets.", "o": [], "a": "power management packets", "x": "", "n": "", "r": "", "s": 0}, {"id": 130, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 11, "q": "The purpose of the PCIe _____ layer is to ensure reliable delivery of packets across the PCIe link.", "o": [], "a": "data link", "x": "", "n": "", "r": "", "s": 0}, {"id": 131, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 12, "q": "With _____ transmission, signals are transmitted as a current that travels down one conductor and returns on the other.", "o": [], "a": "balanced", "x": "", "n": "", "r": "", "s": 0}, {"id": 132, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 13, "q": "The QPI link layer performs two key functions: flow control and _____ control.", "o": [], "a": "error", "x": "", "n": "", "r": "", "s": 0}, {"id": 133, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 14, "q": "The _____ is a popular high-bandwidth, processor-independent bus that can function as a mezzanine or peripheral bus.", "o": [], "a": "PCI", "x": "", "n": "", "r": "", "s": 0}, {"id": 134, "sec": "Chapter 3: A Top-Level View of Computer Function and Interconnection", "t": "fib", "k": 15, "q": "The _____ function is needed to ensure that a sending QPI entity does not overwhelm a receiving QPI entity by sending data faster than the receiver can process the data and clear buffers for more incoming data.", "o": [], "a": "flow control", "x": "", "n": "", "r": "", "s": 0}, {"id": 135, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 1, "q": "No single technology is optimal in satisfying the memory requirements for a computer system.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 136, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 2, "q": "A typical computer system is equipped with a hierarchy of memory subsystems, some internal to the system and some external.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 137, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 3, "q": "External memory is often equated with main memory.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 138, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 4, "q": "The processor requires its own local memory.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 139, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 5, "q": "Cache is not a form of internal memory.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 140, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 6, "q": "The unit of transfer must equal a word or an addressable unit.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 141, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 7, "q": "Both sequential access and direct access involve a shared read- write mechanism.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 142, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 8, "q": "In a volatile memory, information decays naturally or is lost when electrical power is switched off.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 143, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 9, "q": "To achieve greatest performance the memory must be able to keep up with the processor.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 144, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 10, "q": "Secondary memory is used to store program and data files and is usually visible to the programmer only in terms of individual bytes or words.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 145, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 11, "q": "The L1 cache is slower than the L3 cache.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 146, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 12, "q": "With write back updates are made only in the cache.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 147, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 13, "q": "It has become possible to have a cache on the same chip as the processor.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 148, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 14, "q": "All of the Pentium processors include two on-chip L1 caches, one for data and one for instructions.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 149, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "tf", "k": 15, "q": "Cache design for HPC is the same as that for other hardware platforms and applications.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 150, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 1, "q": "__________ refers to whether memory is internal or external to the computer.", "o": [["A", "Location"], ["B", "Access"], ["C", "Hierarchy"], ["D", "Tag"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 151, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 2, "q": "Internal memory capacity is typically expressed in terms of _________.", "o": [["A", "hertz"], ["B", "nanos"], ["C", "bytes"], ["D", "LOR"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 152, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 3, "q": "For internal memory, the __________ is equal to the number of electrical lines into and out of the memory module.", "o": [["A", "access time"], ["B", "unit of transfer"], ["C", "capacity"], ["D", "memory ratio"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 153, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 4, "q": "“Memory is organized into records and access must be made in a specific linear sequence” is a description of __________.", "o": [["A", "sequential access"], ["B", "direct access"], ["C", "random access"], ["D", "associative access"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 154, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 5, "q": "individual blocks or records have a unique address based on physical location with __________.", "o": [["A", "associative"], ["B", "physical access access"], ["C", "direct access"], ["D", "sequential access"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 155, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 6, "q": "For random-access memory, __________ is the time from the instant that an address is presented to the memory to the instant that data have been stored or made available for use.", "o": [["A", "memory cycle time"], ["B", "direct access"], ["C", "transfer rate"], ["D", "access time"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 156, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 7, "q": "The ________ consists of the access time plus any additional time required before a second access can commence.", "o": [["A", "latency"], ["B", "memory cycle time"], ["C", "direct access"], ["D", "transfer rate"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 157, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 8, "q": "A portion of main memory used as a buffer to hold data temporarily that is to be read out to disk is referred to as a _________.", "o": [["A", "disk cache"], ["B", "latency"], ["C", "virtual address"], ["D", "miss"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 158, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 9, "q": "A line includes a _________ that identifies which particular block is currently being stored.", "o": [["A", "cache"], ["B", "hit"], ["C", "tag"], ["D", "locality"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 159, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 10, "q": "__________ is the simplest mapping technique and maps each block of main memory into only one possible cache line.", "o": [["A", "Direct mapping"], ["B", "Associative mapping"], ["C", "Set associative mapping"], ["D", "None of the above"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 160, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 11, "q": "When using the __________ technique all write operations made to main memory are made to the cache as well.", "o": [["A", "write back"], ["B", "LRU"], ["C", "write through"], ["D", "unified cache"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 161, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 12, "q": "The key advantage of the __________ design is that it eliminates contention for the cache between the instruction fetch/decode unit and the execution unit.", "o": [["A", "logical cache"], ["B", "split cache"], ["C", "unified cache"], ["D", "physical cache"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 162, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 13, "q": "The Pentium 4 _________ component executes micro-operations, fetching the required data from the L1 data cache and temporarily storing results in registers.", "o": [["A", "fetch/decode unit"], ["B", "out-of-order execution logic"], ["C", "execution unit"], ["D", "memory subsystem"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 163, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 14, "q": "In reference to access time to a two-level memory, a _________ occurs if an accessed word is not found in the faster memory.", "o": [["A", "miss"], ["B", "hit"], ["C", "line"], ["D", "tag"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 164, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "mcq", "k": 15, "q": "A logical cache stores data using __________.", "o": [["A", "physical addresses"], ["B", "virtual addresses"], ["C", "random addresses"], ["D", "none of the above"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 165, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "fib", "k": 1, "q": "_____ memory consists of peripheral storage devices, such as disk and tape.", "o": [], "a": "External", "x": "", "n": "", "r": "", "s": 0}, {"id": 166, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "fib", "k": 2, "q": "One byte equals _____ bits.", "o": [], "a": "8", "x": "", "n": "", "r": "", "s": 0}, {"id": 167, "sec": "Chapter 4: Cache Memory & Memory Characteristics", "t": "fib", "k": 3, "q": "From a user's point of view the two most important characteristics of memory are capacity and _____.", "o": [], "a": "performance", "x": "", "n": "", "r": "",
