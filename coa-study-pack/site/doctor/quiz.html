"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 189, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "tf", "k": 10, "q": "Computers are classified into generations based on the fundamental hardware technology employed.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 190, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "tf", "k": 11, "q": "System software was introduced in the third generation of computers.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 191, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "tf", "k": 12, "q": "A wafer is made of silicon and is broken up into chips which consists of many gates and/or memory cells plus a number of input and output attachment points.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 192, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "tf", "k": 13, "q": "IBM's System/360 was the industry's first planned family of computers.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 193, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "tf", "k": 14, "q": "Intel's 4004 was the first chip to contain all of the components of a CPU on a single chip.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 194, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "tf", "k": 15, "q": "The Intel x86 evolved from RISC design principles and is used in embedded systems.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 195, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "tf", "k": 16, "q": "A common measure of performance for a processor is the rate at which instructions are executed, expressed as billions of instructions per seconds (BIPS).", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 196, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 1, "q": "The _________ was the world's first general-purpose electronic digital computer.", "o": [["A", "UNIVAC"], ["B", "MARK IV"], ["C", "ENIAC"], ["D", "Hollerith's Counting Machine"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 197, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 2, "q": "The Electronic Numerical Integrator and Computer project was a response to U.S. needs during _________.", "o": [["A", "the Civil War"], ["B", "the French-American War"], ["C", "World War I"], ["D", "World War II"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 198, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 3, "q": "The ENIAC used __________.", "o": [["A", "vacuum tubes"], ["B", "integrated circuits"], ["C", "IAS"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 199, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 4, "q": "The ENIAC is an example of a _________ generation computer.", "o": [["A", "first"], ["B", "second"], ["C", "third"], ["D", "fourth"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 200, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 5, "q": "The __________ interprets the instructions in memory and causes them to be executed.", "o": [["A", "main memory"], ["B", "control unit"], ["C", "I/O"], ["D", "arithmetic and logic unit"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 201, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 6, "q": "The memory of the IAS consists of 1000 storage locations called __________.", "o": [["A", "opcodes"], ["B", "wafers"], ["C", "VLSIs"], ["D", "words"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 202, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 7, "q": "The __________ contains the 8-bit opcode instruction being executed.", "o": [["A", "memory buffer register"], ["B", "instruction buffer register"], ["C", "instruction register"], ["D", "memory address register"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 203, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 8, "q": "During the _________ the opcode of the next instruction is loaded into the IR and the address portion is loaded into the MAR.", "o": [["A", "executes cycle"], ["B", "fetch cycle"], ["C", "instruction cycle"], ["D", "clock cycle"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 204, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 9, "q": "Second generation computers used __________.", "o": [["A", "integrated circuits"], ["B", "Transistors"], ["C", "vacuum tubes"], ["D", "large-scale integration"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 205, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 10, "q": "The __________ defines the third generation of computers.", "o": [["A", "integrated circuit"], ["B", "vacuum tube"], ["C", "transistor"], ["D", "VLSI"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 206, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 11, "q": "With the __________, Intel introduced the use of superscalar techniques that allow multiple instructions to execute in parallel.", "o": [["A", "Core"], ["B", "8080"], ["C", "80486"], ["D", "Pentium"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 207, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 12, "q": "ARM processors are designed to meet the needs of _________.", "o": [["A", "embedded real-time systems"], ["B", "application platforms"], ["C", "secure applications"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 208, "sec": "Additional questions from the compiled list (Chapters 1-4 topics)", "t": "mcq", "k": 13, "q": "One increment, or pulse, of the system clock is referred to as a _________.", "o": [["A", "clock tick"], ["B", "cycle time"], ["C", "clock rate"], ["D", "cycle speed"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 209, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 1, "q": "The basic element of a semiconductor memory is the memory cell.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 210, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 2, "q": "A characteristic of ROM is that it is volatile.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 211, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 3, "q": "RAM must be provided with a constant power supply.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 212, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 4, "q": "The two traditional forms of RAM used in computers are DRAM and SRAM.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 213, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 5, "q": "A static RAM will hold its data as long as power is supplied to it.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 214, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 6, "q": "Nonvolatile means that power must be continuously supplied to the memory to preserve the bit values.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 215, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 7, "q": "The advantage of RAM is that the data or program is permanently in main memory and need never be loaded from a secondary storage device.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 216, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 8, "q": "Semiconductor memory comes in packaged chips.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 217, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 9, "q": "All DRAMs require a refresh operation.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 218, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 10, "q": "A number of chips can be grouped together to form a memory bank.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 219, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 11, "q": "An error-correcting code enhances the reliability of the memory at the cost of added complexity.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 220, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 12, "q": "DRAM is much costlier than SRAM.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 221, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 13, "q": "RDRAM is limited by the fact that it can only send data to the processor once per bus clock cycle.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "الجملة تنسب القيد إلى RDRAM بينما المصدر المعروف (Stallings) ينسبه إلى SDRAM؛ اخترنا FALSE.", "r": "", "s": 1}, {"id": 222, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 14, "q": "The prefetch buffer is a memory cache located on the RAM chip.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 223, "sec": "Internal Memory (semiconductor memory)", "t": "tf", "k": 15, "q": "The SRAM on the CDRAM cannot be used as a buffer to support the serial access of a block of data.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 224, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 1, "q": "Which properties do all semiconductor memory cells share?", "o": [["A", "they exhibit two stable states which can be used to represent binary 1 and 0"], ["B", "they are capable of being written into to set the state"], ["C", "they are capable of being read to sense the state"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 1}, {"id": 225, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 2, "q": "One distinguishing characteristic of memory that is designated as _________ is that it is possible to both to read data from the memory and to write new data into the memory easily and rapidly.", "o": [["A", "RAM"], ["B", "ROM"], ["C", "EPROM"], ["D", "EEPROM"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 226, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 3, "q": "Which of the following memory types are nonvolatile?", "o": [["A", "erasable PROM"], ["B", "programmable ROM"], ["C", "flash memory"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 1}, {"id": 227, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 4, "q": "In a _________, binary values are stored using traditional flip-flop logic-gate configurations.", "o": [["A", "ROM"], ["B", "SRAM"], ["C", "DRAM"], ["D", "RAM"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 228, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 5, "q": "A __________ contains a permanent pattern of data that cannot be changed, is nonvolatile, and cannot have new data written into it.", "o": [["A", "RAM"], ["B", "SRAM"], ["C", "ROM"], ["D", "flash memory"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 229, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 6, "q": "With _________ the microchip is organized so that a section of memory cells are erased in a single action.", "o": [["A", "flash memory"], ["B", "SDRAM"], ["C", "DRAM"], ["D", "EEPROM"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 230, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 7, "q": "__________ can be caused by harsh environmental abuse, manufacturing defects, and wear.", "o": [["A", "SEC errors"], ["B", "Hard errors"], ["C", "Syndrome errors"], ["D", "Soft errors"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 231, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 8, "q": "_________ can be caused by power supply problems or alpha particles.", "o": [["A", "Soft errors"], ["B", "AGT errors"], ["C", "Hard errors"], ["D", "SEC errors"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 232, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 9, "q": "The _________ exchanges data with the processor synchronized to an external clock signal and running at the full speed of the processor/memory bus without imposing wait states.", "o": [["A", "DDR-DRAM"], ["B", "SDRAM"], ["C", "CDRAM"], ["D", "none of the above"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 233, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 10, "q": "________ can send data to the processor twice per clock cycle.", "o": [["A", "CDRAM"], ["B", "SDRAM"], ["C", "DDR-DRAM"], ["D", "RDRAM"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 234, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 11, "q": "__________ increases the data transfer rate by increasing the operational frequency of the RAM chip and by increasing the prefetch buffer from 2 bits to 4 bits per chip.", "o": [["A", "DDR2"], ["B", "RDRAM"], ["C", "CDRAM"], ["D", "DDR3"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 235, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 12, "q": "_______ increases the prefetch buffer size to 8 bits.", "o": [["A", "CDRAM"], ["B", "RDRAM"], ["C", "DDR3"], ["D", "all of the above"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 236, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 13, "q": "Theoretically, a DDR module can transfer data at a clock rate in the range of __________ MHz.", "o": [["A", "200 to 600"], ["B", "400 to 1066"], ["C", "600 to 1400"], ["D", "800 to 1600"]], "a": "A", "x": "", "n": "حسب Stallings: DDR من 200 إلى 600 MHz (DDR2: 400–1066، DDR3: 800–1600).", "r": "", "s": 1}, {"id": 237, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 14, "q": "A DDR3 module transfers data at a clock rate of __________ MHz.", "o": [["A", "600 to 1200"], ["B", "800 to 1600"], ["C", "1000 to 2000"], ["D", "1500 to 3000"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 238, "sec": "Internal Memory (semiconductor memory)", "t": "mcq", "k": 15, "q": "The ________ enables the RAM chip to preposition bits to be placed on the data bus as rapidly as possible.", "o": [["A", "flash memory"], ["B", "Hamming code"], ["C", "RamBus"], ["D", "buffer"]], "a": "D", "x": "", "n": "", "r": "", "s": 1}, {"id": 239, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 1, "q": "Magnetic disks are the foundation of external memory on virtually all computer systems.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 240, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 2, "q": "During a read or write operation, the head rotates while the platter beneath it stays stationary.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 241, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 3, "q": "The width of a track is double that of the head.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 242, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 4, "q": "There are typically hundreds of sectors per track and they may be either fixed or variable lengths.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 243, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 5, "q": "A bit near the center of a rotating disk travels past a fixed point slower than a bit on the outside.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 244, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 6, "q": "The disadvantage of using CAV is that individual blocks of data can only be directly addressed by track and sector.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 245, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 7, "q": "A removable disk can be removed and replaced with another disk.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 246, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 8, "q": "The head must generate or sense an electromagnetic field of sufficient magnitude to write and read properly.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 247, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 9, "q": "The transfer time to or from the disk does not depend on the rotation speed of the disk.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 248, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 10, "q": "RAID is a set of physical disk drives viewed by the operating system as a single logical drive.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 249, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 11, "q": "RAID level 0 is not a true member of the RAID family because it does not include redundancy to improve performance.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "الصياغة «redundancy to improve performance» كما في كتاب Stallings؛ اخترنا TRUE.", "r": "", "s": 1}, {"id": 250, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 12, "q": "Because data are striped in very small strips, RAID 3 cannot achieve very high data transfer rates.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 251, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 13, "q": "The SSDs now on the market use a type of semiconductor memory referred to as flash memory.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 252, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 14, "q": "SSD performance has a tendency to speed up as the device is used.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 253, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "tf", "k": 15, "q": "Flash memory becomes unusable after a certain number of writes.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 254, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 1, "q": "Greater ability to withstand shock and damage, improvement in the uniformity of the magnet film surface to increase disk reliability, and a significant reduction in overall surface defects to help reduce read-write errors, are all benefits of ___________.", "o": [["A", "magnetic read and write mechanisms"], ["B", "platters"], ["C", "the glass substrate"], ["D", "a solid state drive"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 255, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 2, "q": "Adjacent tracks are separated by _________.", "o": [["A", "sectors"], ["B", "gaps"], ["C", "pits"], ["D", "heads"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 256, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 3, "q": "Data are transferred to and from the disk in __________.", "o": [["A", "tracks"], ["B", "gaps"], ["C", "sectors"], ["D", "pits"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 257, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 4, "q": "In most contemporary systems fixed-length sectors are used, with _________ bytes being the nearly universal sector size.", "o": [["A", "64"], ["B", "128"], ["C", "256"], ["D", "512"]], "a": "D", "x": "", "n": "", "r": "", "s": 1}, {"id": 258, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 5, "q": "Scanning information at the same rate by rotating the disk at a fixed speed is known as the _________.", "o": [["A", "constant angular velocity"], ["B", "magnetoresistive"], ["C", "rotational delay"], ["D", "constant linear velocity"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 259, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 6, "q": "The disadvantage of _________ is that the amount of data that can be stored on the long outer tracks is only the same as what can be stored on the short inner tracks.", "o": [["A", "SSD"], ["B", "CAV"], ["C", "ROM"], ["D", "CLV"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 260, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 7, "q": "A __________ disk is permanently mounted in the disk drive, such as the hard disk in a personal computer.", "o": [["A", "nonremovable"], ["B", "movable-head"], ["C", "double sided"], ["D", "removable"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 261, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 8, "q": "When the magnetizable coating is applied to both sides of the platter the disk is then referred to as _________.", "o": [["A", "multiple sided"], ["B", "substrate"], ["C", "double sided"], ["D", "all of the above"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 262, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 9, "q": "The set of all the tracks in the same relative position on the platter is referred to as a _________.", "o": [["A", "floppy disk"], ["B", "single-sided disk"], ["C", "sector"], ["D", "cylinder"]], "a": "D", "x": "", "n": "", "r": "", "s": 1}, {"id": 263, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 10, "q": "The sum of the seek time and the rotational delay equals the _________, which is the time it takes to get into position to read or write.", "o": [["A", "access time"], ["B", "gap time"], ["C", "transfer time"], ["D", "constant angular velocity"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 264, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 11, "q": "__________ is the standardized scheme for multiple-disk database design.", "o": [["A", "RAID"], ["B", "CAV"], ["C", "CLV"], ["D", "SSD"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 265, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 12, "q": "RAID level ________ has the highest disk overhead of all RAID types.", "o": [["A", "0"], ["B", "1"], ["C", "3"], ["D", "5"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 266, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 13, "q": "A _________ is a high-definition video disk that can store 25 Gbytes on a single layer on a single side.", "o": [["A", "DVD"], ["B", "DVD-R"], ["C", "DVD-RW"], ["D", "Blu-ray DVD"]], "a": "D", "x": "", "n": "", "r": "", "s": 1}, {"id": 267, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 14, "q": "________ is when the disk rotates more slowly for accesses near the outer edge than for those near the center.", "o": [["A", "Constant angular velocity (CAV)"], ["B", "Magnetoresistive"], ["C", "Constant linear velocity (CLV)"], ["D", "Seek time"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 268, "sec": "External Memory (disks, RAID, SSD, optical)", "t": "mcq", "k": 15, "q": "The areas between pits are called _________.", "o": [["A", "lands"], ["B", "sectors"], ["C", "cylinders"], ["D", "strips"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 269, "sec": "Input/Output (I/O)", "t": "tf", "k": 1, "q": "A set of I/O modules is a key element of a computer system.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 270, "sec": "Input/Output (I/O)", "t": "tf", "k": 2, "q": "An I/O module must recognize one unique address for each peripheral it controls.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 271, "sec": "Input/Output (I/O)", "t": "tf", "k": 3, "q": "I/O channels are commonly seen on microcomputers, whereas I/O controllers are used on mainframes.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 272, "sec": "Input/Output (I/O)", "t": "tf", "k": 4, "q": "It is the responsibility of the processor to periodically check the status of the I/O module until it finds that the operation is complete.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 273, "sec": "Input/Output (I/O)", "t": "tf", "k": 5, "q": "With isolated I/O there is a single address space for memory locations and I/O devices.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 274, "sec": "Input/Output (I/O)", "t": "tf", "k": 6, "q": "A disadvantage of memory-mapped I/O is that valuable memory address space is used up.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 275, "sec": "Input/Output (I/O)", "t": "tf", "k": 7, "q": "The disadvantage of the software poll is that it is time consuming.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 276, "sec": "Input/Output (I/O)", "t": "tf", "k": 8, "q": "With a daisy chain the processor just picks the interrupt line with the highest priority.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 277, "sec": "Input/Output (I/O)", "t": "tf", "k": 9, "q": "Bus arbitration makes use of vectored interrupts.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "حسب Stallings: bus arbitration شكل من أشكال vectored interrupt.", "r": "", "s": 1}, {"id": 278, "sec": "Input/Output (I/O)", "t": "tf", "k": 10, "q": "The rotating interrupt mode allows the processor to inhibit interrupts from certain devices.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 279, "sec": "Input/Output (I/O)", "t": "tf", "k": 11, "q": "Because the 82C55A is programmable via the control register, it can be used to control a variety of simple peripheral devices.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 280, "sec": "Input/Output (I/O)", "t": "tf", "k": 12, "q": "When large volumes of data are to be moved, a more efficient technique is direct memory access (DMA).", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 281, "sec": "Input/Output (I/O)", "t": "tf", "k": 13, "q": "An I/O channel has the ability to execute I/O instructions, which gives it complete control over I/O operations.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 1}, {"id": 282, "sec": "Input/Output (I/O)", "t": "tf", "k": 14, "q": "A multipoint external interface provides a dedicated line between the I/O module and the external device.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 283, "sec": "Input/Output (I/O)", "t": "tf", "k": 15, "q": "A Thunderbolt compatible peripheral interface is no more complex than that of a simple USB device.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 1}, {"id": 284, "sec": "Input/Output (I/O)", "t": "mcq", "k": 1, "q": "The _________ contains logic for performing a communication function between the peripheral and the bus.", "o": [["A", "I/O channel"], ["B", "I/O module"], ["C", "I/O processor"], ["D", "I/O command"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 285, "sec": "Input/Output (I/O)", "t": "mcq", "k": 2, "q": "The most common means of computer/user interaction is a __________.", "o": [["A", "keyboard/monitor"], ["B", "mouse/printer"], ["C", "modem/printer"], ["D", "monitor/printer"]], "a": "A", "x": "", "n": "", "r": "", "s": 1}, {"id": 286, "sec": "Input/Output (I/O)", "t": "mcq", "k": 3, "q": "The I/O function includes a _________ requirement to coordinate the flow of traffic between internal resources and external devices.", "o": [["A", "cycle"], ["B", "status reporting"], ["C", "control and timing"], ["D", "data"]], "a": "C", "x": "", "n": "", "r": "", "s": 1}, {"id": 287, "sec": "Input/Output (I/O)", "t": "mcq", "k": 4, "q": "An I/O module that takes on most of the detailed processing burden, presenting a high-level interface to the processor, is usually referred to as an _________.", "o": [["A", "I/O channel"], ["B", "I/O command"], ["C", "I/O controller"], ["D", "device controller"]], "a": "A", "x": "", "n": "حسب Stallings: «I/O channel» أو «I/O processor»؛ الخيار المتاح هو I/O channel.", "r": "", "s": 1}, {"id": 288, "sec": "Input/Output (I/O)", "t": "mcq", "k": 5, "q": "An I/O module that is quite primitive and requires detailed control is usually referred to as an _________.", "o": [["A", "I/O command"], ["B", "I/O controller"], ["C", "I/O channel"], ["D", "I/O processor"]], "a": "B", "x": "", "n": "", "r": "", "s": 1}, {"id": 289, "sec": "Input/Output (I/O)", "t": "mcq", "k": 6, "q": "The _________ command causes the I/O module to take an item of data from the data bus and subsequently transmit that data item to the peripheral.", "o": [["A", "control"], ["B", "test"], ["C", "read"], ["D", "write"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 290, "sec": "Input/Output (I/O)", "t": "mcq", "k": 7, "q": "The ________ command is used to activate a peripheral and tell it what to do.", "o": [["A", "control"], ["B", "test"], ["C", "read"], ["D", "write"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 291, "sec": "Input/Output (I/O)", "t": "mcq", "k": 8, "q": "________ is when the DMA module must force the processor to suspend operation temporarily.", "o": [["A", "Interrupt"], ["B", "Thunderbolt"], ["C", "Cycle stealing"], ["D", "Lock down"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 292, "sec": "Input/Output (I/O)", "t": "mcq", "k": 9, "q": "The 8237 DMA is known as a _________ DMA controller.", "o": [["A", "command"], ["B", "cycle stealing"], ["C", "interrupt"], ["D", "fly-by"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 293, "sec": "Input/Output (I/O)", "t": "mcq", "k": 10, "q": "________ is a digital display interface standard now widely adopted for computer monitors, laptop displays, and other graphics and video interfaces.", "o": [["A", "DisplayPort"], ["B", "PCI Express"], ["C", "Thunderbolt"], ["D", "InfiniBand"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 294, "sec": "Input/Output (I/O)", "t": "mcq", "k": 11, "q": "The ________ layer is the key to the operation of Thunderbolt and what makes it attractive as a high-speed peripheral I/O technology.", "o": [["A", "cable"], ["B", "application"], ["C", "common transport"], ["D", "physical"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 295, "sec": "Input/Output (I/O)", "t": "mcq", "k": 12, "q": "The Thunderbolt protocol _________ layer is responsible for link maintenance including hot-plug detection and data encoding to provide highly efficient data transfer.", "o": [["A", "cable"], ["B", "application"], ["C", "common transport"], ["D", "physical"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 296, "sec": "Input/Output (I/O)", "t": "mcq", "k": 13, "q": "The ________ contains I/O protocols that are mapped on to the transport layer.", "o": [["A", "cable"], ["B", "application"], ["C", "common transport"], ["D", "physical"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 297, "sec": "Input/Output (I/O)", "t": "mcq", "k": 14, "q": "A ________ is used to connect storage systems, routers, and other peripheral devices to an InfiniBand switch.", "o": [["A", "target channel adapter"], ["B", "InfiniBand switch"], ["C", "host channel adapter"], ["D", "subnet"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 298, "sec": "Input/Output (I/O)", "t": "mcq", "k": 15, "q": "A ________ connects InfiniBand subnets, or connects an InfiniBand switch to a network such as a local area network, wide area network, or storage area network.", "o": [["A", "memory controller"], ["B", "TCA"], ["C", "HCA"], ["D", "router"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 299, "sec": "Operating Systems", "t": "tf", "k": 1, "q": "Scheduling and memory management are the two OS functions that are most relevant to the study of computer organization and architecture.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 300, "sec": "Operating Systems", "t": "tf", "k": 2, "q": "The end user is concerned mainly with the computer's architecture.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 301, "sec": "Operating Systems", "t": "tf", "k": 3, "q": "The most important system program is the OS.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 302, "sec": "Operating Systems", "t": "tf", "k": 4, "q": "The ABI is the boundary between hardware and software.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 303, "sec": "Operating Systems", "t": "tf", "k": 5, "q": "The OS must determine how much processor time is to be devoted to the execution of a particular user program.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 304, "sec": "Operating Systems", "t": "tf", "k": 6, "q": "With a batch operating system the user does not have direct access to the processor.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 305, "sec": "Operating Systems", "t": "tf", "k": 7, "q": "Privileged instructions are certain instructions that are designated special and can be executed only by the monitor.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 306, "sec": "Operating Systems", "t": "tf", "k": 8, "q": "Uniprogramming is the central theme of modern operating systems.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 307, "sec": "Operating Systems", "t": "tf", "k": 9, "q": "Both batch multiprogramming and time sharing use multiprogramming.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 308, "sec": "Operating Systems", "t": "tf", "k": 10, "q": "An interrupt is a hardware-generated signal to the processor.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 309, "sec": "Operating Systems", "t": "tf", "k": 11, "q": "Swapping is an I/O operation.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 310, "sec": "Operating Systems", "t": "tf", "k": 12, "q": "With demand paging it is necessary to load an entire process into main memory.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 311, "sec": "Operating Systems", "t": "tf", "k": 13, "q": "The Pentium II includes hardware for both segmentation and paging.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 312, "sec": "Operating Systems", "t": "tf", "k": 14, "q": "ARM provides a versatile virtual memory system architecture that can be tailored to the needs of the embedded system designer.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 313, "sec": "Operating Systems", "t": "tf", "k": 15, "q": "Managers are users of domains that must observe the access permissions of the individual sections and/or pages that make up that domain.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 314, "sec": "Operating Systems", "t": "mcq", "k": 1, "q": "The __________ is a program that controls the execution of application programs and acts as an interface between applications and the computer hardware.", "o": [["A", "job control language"], ["B", "operating system"], ["C", "batch system"], ["D", "nucleus"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 315, "sec": "Operating Systems", "t": "mcq", "k": 2, "q": "Facilities and services provided by the OS that assist the programmer in creating programs are in the form of _________ programs that are not actually part of the OS but are accessible through the OS.", "o": [["A", "utility"], ["B", "multitasking"], ["C", "JCL"], ["D", "logical address"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 316, "sec": "Operating Systems", "t": "mcq", "k": 3, "q": "The _________ defines the repertoire of machine language instructions that a computer can follow.", "o": [["A", "ABI"], ["B", "API"], ["C", "HLL"], ["D", "ISA"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 317, "sec": "Operating Systems", "t": "mcq", "k": 4, "q": "The _________ defines the system call interface to the operating system and the hardware resources and services available in a system through the user instruction set architecture.", "o": [["A", "HLL"], ["B", "API"], ["C", "ABI"], ["D", "ISA"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 318, "sec": "Operating Systems", "t": "mcq", "k": 5, "q": "The ________ gives a program access to the hardware resources and services available in a system through the user instruction set architecture supplemented with high-level language library calls.", "o": [["A", "JCL"], ["B", "ISA"], ["C", "ABI"], ["D", "API"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 319, "sec": "Operating Systems", "t": "mcq", "k": 6, "q": "A _________ system works only one program at a time.", "o": [["A", "batch"], ["B", "uniprogramming"], ["C", "kernel"], ["D", "privileged instruction"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 320, "sec": "Operating Systems", "t": "mcq", "k": 7, "q": "A _________ is a special type of programming language used to provide instructions to the monitor.", "o": [["A", "job control language"], ["B", "multiprogram"], ["C", "kernel"], ["D", "utility"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 321, "sec": "Operating Systems", "t": "mcq", "k": 8, "q": "The _________ scheduler determines which programs are admitted to the system for processing.", "o": [["A", "long-term"], ["B", "medium-term"], ["C", "short-term"], ["D", "I/O"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 322, "sec": "Operating Systems", "t": "mcq", "k": 9, "q": "The ________ scheduler is also known as the dispatcher.", "o": [["A", "long-term"], ["B", "medium-term"], ["C", "short-term"], ["D", "I/O"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 323, "sec": "Operating Systems", "t": "mcq", "k": 10, "q": "A _________ is an actual location in main memory.", "o": [["A", "logical address"], ["B", "partition address"], ["C", "base address"], ["D", "physical address"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 324, "sec": "Operating Systems", "t": "mcq", "k": 11, "q": "________ is when the processor spends most of its time swapping pages rather than executing instructions.", "o": [["A", "Swapping"], ["B", "Thrashing"], ["C", "Paging"], ["D", "Multitasking"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 325, "sec": "Operating Systems", "t": "mcq", "k": 12, "q": "Virtual memory schemes make use of a special cache called a ________ for page table entries.", "o": [["A", "TLB"], ["B", "HLL"], ["C", "VMC"], ["D", "SPB"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 326, "sec": "Operating Systems", "t": "mcq", "k": 13, "q": "With _________ the virtual address is the same as the physical address.", "o": [["A", "unsegmented unpaged memory"], ["B", "unsegmented paged memory"], ["C", "segmented unpaged memory"], ["D", "segmented paged memory"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 327, "sec": "Operating Systems", "t": "mcq", "k": 14, "q": "A _________ is a collection of memory regions.", "o": [["A", "APX"], ["B", "nucleus"], ["C", "domain"], ["D", "page table"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 328, "sec": "Operating Systems", "t": "mcq", "k": 15, "q": "The OS maintains a __________ for each process that shows the frame location for each page of the process.", "o": [["A", "kernel"], ["B", "page table"], ["C", "TLB"], ["D", "logical address"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 329, "sec": "Number Systems", "t": "tf", "k": 1, "q": "Our primary counting system is based on binary digits to represent numbers.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 330, "sec": "Number Systems", "t": "tf", "k": 2, "q": "The decimal system has a radix of 100.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 331, "sec": "Number Systems", "t": "tf", "k": 3, "q": "Negative powers of 10 are used to represent the positions of the numbers for decimal fractions.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "",  significant digit"], ["B", "least significant digit"], ["C", "radix"], ["D", "base"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 349, "sec": "Number Systems", "t": "mcq", "k": 6, "q": "Numbers in the binary system are represented to the _________.", "o": [["A", "base 0"], ["B", "base 1"], ["C", "base 2"], ["D", "base 10"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 350, "sec": "Number Systems", "t": "mcq", "k": 7, "q": "Hexadecimal has a base of _________.", "o": [["A", "2"], ["B", "8"], ["C", "10"], ["D", "16"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 351, "sec": "Number Systems", "t": "mcq", "k": 8, "q": "The binary string 110111100001 is equivalent to __________.", "o": [["A", "DE116"], ["B", "C7816"], ["C", "FF6416"], ["D", "B8F16"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 352, "sec": "Number Systems", "t": "mcq", "k": 9, "q": "The _________ system uses only the numbers 0 and 1.", "o": [["A", "positional"], ["B", "binary"], ["C", "hexadecimal"], ["D", "decimal"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 353, "sec": "Number Systems", "t": "mcq", "k": 10, "q": "Decimal \"10\" is __________ in binary.", "o": [["A", "1000"], ["B", "0010"], ["C", "1010"], ["D", "0001"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 354, "sec": "Number Systems", "t": "mcq", "k": 11, "q": "Decimal \"10\" is _________ in hexadecimal.", "o": [["A", "1"], ["B", "A"], ["C", "0"], ["D", "FF"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 355, "sec": "Number Systems", "t": "mcq", "k": 12, "q": "Four bits is called a _________.", "o": [["A", "radix point"], ["B", "byte"], ["C", "nibble"], ["D", "binary digit"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 356, "sec": "Number Systems", "t": "mcq", "k": 13, "q": "Another term for \"base\" is __________.", "o": [["A", "radix"], ["B", "integer"], ["C", "position"], ["D", "digit"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 357, "sec": "Number Systems", "t": "mcq", "k": 14, "q": "In the number 472.156 the 2 is the _________.", "o": [["A", "most significant digit"], ["B", "radix point"], ["C", "least significant digit"], ["D", "none of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 358, "sec": "Number Systems", "t": "mcq", "k": 15, "q": "Binary 0101 is hexadecimal _________.", "o": [["A", "0"], ["B", "5"], ["C", "A"], ["D", "10"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 359, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 1, "q": "The operation of the digital computer is based on the storage and processing of binary data.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 360, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 2, "q": "Claude Shannon, a research assistant in the Electrical Engineering Department at M.I.T., proposed the basic principles of Boolean algebra.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 361, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 3, "q": "In the absence of parentheses, the AND operation takes precedence over the OR operation.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 362, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 4, "q": "Logical functions are implemented by the interconnection of decoders.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 363, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 5, "q": "The delay by the propagation time of signals through the gate is known as the gate delay.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 364, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 6, "q": "A combinational circuit consists of n binary inputs and m binary outputs.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 365, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 7, "q": "Any Boolean function can be implemented in electronic form as a network of gates.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 366, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 8, "q": "A Boolean function can be realized in the sum of products (SOP) form but not in the product of sums (POS) form.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 367, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 9, "q": "\"Don't care\" conditions are when certain combinations of values of variables never occur, and therefore the corresponding output never occurs.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 368, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 10, "q": "The value to be loaded into the program counter can come from a binary counter, the instruction register, or the output of the ALU.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 369, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 11, "q": "In general, a decoder has n inputs and 2n outputs.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 370, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 12, "q": "Combinational circuits are often referred to as \"memoryless\" circuits because their output depends only on their current input and no history of prior inputs is retained.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 371, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 13, "q": "Binary addition is exactly the same as Boolean algebra.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 372, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 14, "q": "Events in the digital computer are synchronized to a clock pulse so that changes occur only when a clock pulse occurs.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 373, "sec": "Boolean Algebra & Digital Logic", "t": "tf", "k": 15, "q": "A register is a digital circuit used within the CPU to store one or more bits of data.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 374, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 1, "q": "The operand ________ yields true if and only if both of its operands are true.", "o": [["A", "XOR"], ["B", "OR"], ["C", "AND"], ["D", "NOT"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 375, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 2, "q": "The operation _________ yields true if either or both of its operands are true.", "o": [["A", "NOT"], ["B", "AND"], ["C", "NAND"], ["D", "OR"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 376, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 3, "q": "The unary operation _________ inverts the value of its operand.", "o": [["A", "OR"], ["B", "NOT"], ["C", "NAND"], ["D", "XOR"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 377, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 4, "q": "A _______ is an electronic circuit that produces an output signal that is a simple Boolean operation on its input signals.", "o": [["A", "gate"], ["B", "decoder"], ["C", "counter"], ["D", "flip-flop"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 378, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 5, "q": "Which of the following is a functionally complete set?", "o": [["A", "AND, NOT"], ["B", "NOR"], ["C", "AND, OR, NOT"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 379, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 6, "q": "For more than four variables an alternative approach is a tabular technique referred to as the _________ method.", "o": [["A", "DeMorgan"], ["B", "Quine-McCluskey"], ["C", "Karnaugh map"], ["D", "Boole-Shannon"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 380, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 7, "q": "________ are used in digital circuits to control signal and data routing.", "o": [["A", "Multiplexers"], ["B", "Program counters"], ["C", "Flip-flops"], ["D", "Gates"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 381, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 8, "q": "________ is implemented with combinational circuits.", "o": [["A", "Nano memory"], ["B", "Random access memory"], ["C", "Read only memory"], ["D", "No memory"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 382, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 9, "q": "The ________ exists in one of two states and, in the absence of input, remains in that state.", "o": [["A", "assert"], ["B", "complex PLD"], ["C", "decoder"], ["D", "flip-flop"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 383, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 10, "q": "The ________ flip-flop has two inputs and all possible combinations of input values are valid.", "o": [["A", "J-K"], ["B", "D"], ["C", "S-R"], ["D", "clocked S-R"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 384, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 11, "q": "A _________ accepts and/or transfers information serially.", "o": [["A", "S-R latch"], ["B", "shift register"], ["C", "FPGA"], ["D", "parallel register"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 385, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 12, "q": "Counters can be designated as _________.", "o": [["A", "asynchronous"], ["B", "synchronous"], ["C", "both asynchronous and synchronous"], ["D", "neither asynchronous or synchronous"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 386, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 13, "q": "CPUs make use of _________ counters, in which all of the flip-flops of the counter change at the same time.", "o": [["A", "synchronous"], ["B", "asynchronous"], ["C", "clocked S-R"], ["D", "timed ripple"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 387, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 14, "q": "The _________ table provides the value of the next output when the inputs and the present output are known, which is exactly the information needed to design the counter or any sequential circuit.", "o": [["A", "excitation"], ["B", "Kenough"], ["C", "J-K flip-flop"], ["D", "FPGA"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 388, "sec": "Boolean Algebra & Digital Logic", "t": "mcq", "k": 15, "q": "A _________ is a PLD featuring a general structure that allows very high logic capacity and offers more narrow logic resources and a higher ration of flip-flops to logic resources than do CPLDs.", "o": [["A", "SPLD"], ["B", "FPGA"], ["C", "PAL"], ["D", "PLA"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 389, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 1, "q": "One boundary where the computer designer and the computer programmer can view the same machine is the machine instruction set.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 390, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 2, "q": "The operation to be performed is specified by a binary code known as the operation code.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 391, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 3, "q": "The address of the next instruction to be fetched must be a real address, not a virtual address.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 392, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 4, "q": "It has become common practice to use a symbolic representation of machine instructions.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 393, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 5, "q": "A high-level language expresses operations in a basic form involving the movement of data to or from registers.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 394, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 6, "q": "One of the traditional ways of describing processor architecture is in terms of the number of addresses contained in each instruction.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 395, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 7, "q": "Memory references are faster than register references.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 396, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 8, "q": "The instruction set is the programmer's means of controlling the processor.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 397, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 9, "q": "Addresses are a form of data.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 398, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 10, "q": "Not all machine languages include numeric data types.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 399, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 11, "q": "ARM processors support data types of 8 (byte), 16 (halfword), and 32 (word) bits in length.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 400, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 12, "q": "Most machines provide the basic arithmetic operations of add, subtract, multiply, and divide.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 401, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 13, "q": "A branch can be either forward or backward.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 402, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 14, "q": "Procedures do not allow programming tasks to be subdivided into smaller units.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 403, "sec": "Instruction Sets: Characteristics & Functions", "t": "tf", "k": 15, "q": "The focus of MMX technology is multimedia programming.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 404, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 1, "q": "The ________ specifies the operation to be performed.", "o": [["A", "source operand reference"], ["B", "opcode"], ["C", "next instruction reference"], ["D", "processor register"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 405, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 2, "q": "A(n) _________ expresses operations in a concise algebraic form using variables.", "o": [["A", "opcode"], ["B", "high-level language"], ["C", "machine language"], ["D", "register"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 406, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 3, "q": "There must be ________ instructions for moving data between memory and the registers.", "o": [["A", "branch"], ["B", "logic"], ["C", "memory"], ["D", "I/O"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 407, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 4, "q": "________ instructions operate on the bits of a word as bits rather than as numbers, providing capabilities for processing any other type of data the user may wish to employ.", "o": [["A", "Logic"], ["B", "Arithmetic"], ["C", "Memory"], ["D", "Test"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 408, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 5, "q": "_________ instructions provide computational capabilities for processing number data.", "o": [["A", "Boolean"], ["B", "Logic"], ["C", "Memory"], ["D", "Arithmetic"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 409, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 6, "q": "_______ instructions are needed to transfer programs and data into memory and the results of computations back out to the user.", "o": [["A", "I/O"], ["B", "Transfer"], ["C", "Control"], ["D", "Branch"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 410, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 7, "q": "The x86 data type that is a signed binary value contained in a byte, word, or doubleword, using twos complement representation is _________.", "o": [["A", "general"], ["B", "ordinal"], ["C", "integer"], ["D", "packed BCD"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 411, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 8, "q": "The most fundamental type of machine instruction is the _________ instruction.", "o": [["A", "conversion"], ["B", "data transfer"], ["C", "arithmetic"], ["D", "logical"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 412, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 9, "q": "The _________ instruction includes an implied address.", "o": [["A", "skip"], ["B", "rotate"], ["C", "stack"], ["D", "push"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 413, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 10, "q": "Which of the following is a true statement?", "o": [["A", "a procedure can be called from more than one location"], ["B", "a procedure call can appear in a procedure"], ["C", "each procedure call is matched by a return in the called program"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 414, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 11, "q": "The entire set of parameters, including return address, which is stored for a procedure invocation is referred to as a _________.", "o": [["A", "branch"], ["B", "stack frame"], ["C", "pop"], ["D", "push"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 415, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 12, "q": "Which ARM operation category includes logical instructions (AND, OR, XOR), add and subtract instructions, and test and compare instructions?", "o": [["A", "data-processing instructions"], ["B", "branch instructions"], ["C", "load and store instructions"], ["D", "extend instructions"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 416, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 13, "q": "In the ARM architecture only _________ instructions access memory locations.", "o": [["A", "data processing"], ["B", "status register access"], ["C", "load and store"], ["D", "branch"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 417, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 14, "q": "Which data type is defined in MMX?", "o": [["A", "packed byte"], ["B", "packed word"], ["C", "packed doubleword"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 418, "sec": "Instruction Sets: Characteristics & Functions", "t": "mcq", "k": 15, "q": "A branch instruction in which the branch is always taken is _________.", "o": [["A", "conditional branch"], ["B", "unconditional branch"], ["C", "jump"], ["D", "bi-endian"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 419, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 1, "q": "The value of the mode field determines which addressing mode is to be used.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 420, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 2, "q": "In a system without virtual memory, the effective address is a virtual address or a register.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 421, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 3, "q": "The disadvantage of immediate addressing is that the size of the number is restricted to the size of the address field.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 422, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 4, "q": "With direct addressing, the length of the address field is usually less than the word length, thus limiting the address range.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 423, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 5, "q": "Register addressing is similar to direct addressing with the only difference being that the address field refers to a register rather than a main memory address.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 424, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 6, "q": "Register indirect addressing uses the same number of memory references as indirect addressing.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 425, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 7, "q": "Three of the most common uses of stack addressing are relative addressing, base- register addressing, and indexing.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 426, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 8, "q": "The method of calculating the EA is the same for both base-register addressing and indexing.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 427, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 9, "q": "Typically an instruction set will include both preindexing and postindexing.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 428, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 10, "q": "The x86 is equipped with a variety of addressing modes intended to allow the efficient execution of high-level languages.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 429, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 11, "q": "The base with index and displacement mode sums the contents of the base register, the index register, and a displacement to form the effective address.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 430, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 12, "q": "The memory transfer rate has not kept up with increases in processor speed.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 431, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 13, "q": "For addresses that reference memory the range of addresses that can be referenced is not related to the number of address bits.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "", "s": 0}, {"id": 432, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 14, "q": "The principal price to pay for variable-length instructions is an increase in the complexity of the processor.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 433, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "tf", "k": 15, "q": "One advantage of linking the addressing mode to the operand rather than the opcode is that any addressing mode can be used with any opcode.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 434, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 1, "q": "The advantage of __________ is that no memory reference other than the instruction fetch is required to obtain the operand.", "o": [["A", "direct addressing"], ["B", "immediate addressing"], ["C", "register addressing"], ["D", "stack addressing"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 435, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 2, "q": "The principal advantage of ___________ addressing is that it is a very simple form of addressing.", "o": [["A", "displacement"], ["B", "register"], ["C", "stack"], ["D", "direct"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 436, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 3, "q": "__________ has the advantage of large address space, however it has the disadvantage of multiple memory references.", "o": [["A", "Indirect addressing"], ["B", "Direct addressing"], ["C", "Immediate addressing"], ["D", "Stack addressing"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 437, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 4, "q": "The advantages of _________ addressing are that only a small address field is needed in the instruction and no time-consuming memory references are required.", "o": [["A", "direct"], ["B", "indirect"], ["C", "register"], ["D", "displacement"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 438, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 5, "q": "__________ has the advantage of flexibility, but the disadvantage of complexity.", "o": [["A", "Stack addressing"], ["B", "Displacement addressing"], ["C", "Direct addressing"], ["D", "Register addressing"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 439, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 6, "q": "For _________, the address field references a main memory address and the referenced register contains a positive displacement from that address.", "o": [["A", "indexing"], ["B", "base-register addressing"], ["C", "relative addressing"], ["D", "all of the above"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 440, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 7, "q": "Indexing performed after the indirection is __________.", "o": [["A", "relative addressing"], ["B", "autoindexing"], ["C", "postindexing"], ["D", "preindexing"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 441, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 8, "q": "For the _________ mode, the operand is included in the instruction.", "o": [["A", "immediate"], ["B", "base"], ["C", "register"], ["D", "displacement"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 442, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 9, "q": "The only form of addressing for branch instructions is _________ addressing.", "o": [["A", "register"], ["B", "relative"], ["C", "base"], ["D", "immediate"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 443, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 10, "q": "Which of the following interrelated factors go into determining the use of the addressing bits?", "o": [["A", "number of operands"], ["B", "number of register sets"], ["C", "address range"], ["D", "all of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 444, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 11, "q": "_________ is a principle by which two variables are independent of each other.", "o": [["A", "Opcode"], ["B", "Orthogonality"], ["C", "Completeness"], ["D", "Autoindexing"]], "a": "B", "x": "", "n": "", "r": "", "s": 0}, {"id": 445, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 12, "q": "The _________ was designed to provide a powerful and flexible instruction set within the constraints of a 16-bit minicomputer.", "o": [["A", "PDP-1"], ["B", "PDP-8"], ["C", "PDP-11"], ["D", "PDP-10"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 446, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 13, "q": "The __________ byte consists of three fields: the Scale field, the Index field and the Base field.", "o": [["A", "SIB"], ["B", "VAX"], ["C", "PDP-11"], ["D", "ModR/M"]], "a": "A", "x": "", "n": "", "r": "", "s": 0}, {"id": 447, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 14, "q": "All instructions in the ARM architecture are __________ bits long and follow a regular format.", "o": [["A", "8"], ["B", "16"], ["C", "32"], ["D", "64"]], "a": "C", "x": "", "n": "", "r": "", "s": 0}, {"id": 448, "sec": "Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 15, "q": "__________ is a design principle employed in designing the PDP-10 instruction set.", "o": [["A", "Orthogonality"], ["B", "Completeness"], ["C", "Direct addressing"], ["D", "All of the above"]], "a": "D", "x": "", "n": "", "r": "", "s": 0}, {"id": 449, "sec": "Processor Structure & Function, Pipelining", "t": "tf", "k": 1, "q": "The processor needs to store instructions and data temporarily while an instruction is being executed.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "", "s": 0}, {"id": 450, "sec": "Processor Structure & Function, Pipelining", "t": "tf", "k": 2, "q": "The control unit (CU) does the actual computation or processing of data.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": const KEY = "coa_models_v1"; let st = {};

const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nz = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const TL = {tf:"صح / خطأ", mcq:"اختيار من متعدد", fib:"أكمل الفراغ"};
const SECS = [...new Set(DATA.map(q => q.sec))];
$("fSec").innerHTML = '<option value="">كل الأقسام</option>' + SECS.map((s,i) => `<option value="${i}">${esc(s)} (${DATA.filter(q=>q.sec===s).length})</option>`).join("");
const shown = () => DATA.filter(q => (!$("fSec").value || q.sec === SECS[+$("fSec").value]) && (!$("fType").value || q.t === $("fType").value));
const isRight = (q, s) => q.t === "fib" ? (s.manual === true || (s.pick && fibOk(q, s.pick))) : s.pick === q.a;
function fibOk(q, v){ const a = nz(q.a), u = nz(v); if (!u) return false; return u === a || (u.length >= 4 && (a.includes(u) || u.includes(a))); }
function render(){
  const L = shown(); $("sTot").textContent = L.length;
  $("list").innerHTML = L.map(q => {
    const s = st[q.id] || {}, locked = !!s.checked;
    let inner = "";
    if (q.t === "fib") inner = `<div class="fib"><input type="text" data-id="${q.id}" value="${esc(s.pick||"")}" ${locked?"disabled":""} placeholder="اكتب إجابتك"></div>`;
    else inner = '<div class="opts">' + q.o.map(([l,t]) => { let c = "o"; if (s.pick === l) c += " sel"; if (locked && l === q.a) c += " right"; if (locked && s.pick === l && l !== q.a) c += " wrong";
      return `<label class="${c}"><input type="radio" name="q${q.id}" value="${l}" data-id="${q.id}" ${s.pick===l?"checked":""} ${locked?"disabled":""}><b>${q.t==="tf"?"":l+"."}</b><span>${esc(t)}</span></label>`; }).join("") + "</div>";
    let fb = "";
    if (locked) { const ok = isRight(q, s); const at = q.t==="fib" ? q.a : (q.t==="tf" ? (q.a==="T"?"True":"False") : q.a+". "+(q.o.find(o=>o[0]===q.a)||[0,""])[1]);
      fb = `<div class="fb ${ok?"ok":"bad"}"><div class="t">${ok?"✓ إجابة صحيحة":"✗ إجابة خاطئة"} — الإجابة: <span dir="ltr">${esc(at)}</span></div>${q.x?`<div>${esc(q.x)}</div>`:""}${q.n?`<div class="warn">${esc(q.n)}</div>`:""}
      ${q.s?'<div class="warn">هذه الإجابة من حلّي أنا (Claude) لأنها غير معلَّمة في ملف الدكتورة.</div>':""}<div class="meta">${esc(q.r||"")}</div>
      ${(!ok && q.t==="fib")?`<button class="sec" data-man="${q.id}">احسبها صحيحة</button>`:""}</div>`; }
    return `<div class="q ${locked?"locked":""}" id="q${q.id}"><div class="tag">${esc(q.sec)} · ${TL[q.t]}</div><div class="qh"><span class="num">${q.k}</span><span>${esc(q.q)}</span></div>${inner}
      <div class="actions"><button data-chk="${q.id}" ${(!s.pick||locked)?"disabled":""}>تحقق</button></div>${fb}</div>`; }).join("");
  stats();
}
function stats(){ const L = shown(); let chk=0, sc=0;
  L.forEach(q => { const s = st[q.id]||{}; if (s.checked){ chk++; if (isRight(q,s)) sc++; } });
  $("sChk").textContent = chk; $("sScore").textContent = sc; $("sChk2").textContent = chk; $("pr").style.width = (L.length ? chk/L.length*100 : 0) + "%";
  const r = $("res"); if (L.length && chk === L.length) { r.classList.remove("hidden"); r.innerHTML = `<b>النتيجة النهائية للمعروض: ${sc} / ${L.length} (${Math.round(sc/L.length*100)}%)</b>`; } else r.classList.add("hidden"); }
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.id && t.type === "radio") { st[t.dataset.id] = Object.assign(st[t.dataset.id]||{}, {pick:t.value}); save(); render(); } });
document.addEventListener("input", e => { const t = e.target; if (t.dataset && t.dataset.id && t.type === "text") { st[t.dataset.id] = Object.assign(st[t.dataset.id]||{}, {pick:t.value}); save(); const b = document.querySelector(`[data-chk="${t.dataset.id}"]`); if (b) b.disabled = !t.value.trim(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-chk]"); if (b) { const id = b.dataset.chk; if ((st[id]||{}).pick) { st[id].checked = true; save(); render(); } return; }
  const m = e.target.closest("[data-man]"); if (m) { st[m.dataset.man].manual = true; save(); render(); } });
["fSec","fType"].forEach(i => $(i).onchange = render);
$("bAll").onclick = () => { shown().forEach(q => { const s = st[q.id]; if (s && s.pick) s.checked = true; }); save(); render(); };
$("bRetry").onclick = () => { shown().forEach(q => { const s = st[q.id]; if (s && s.checked && !isRight(q,s)) delete st[q.id]; }); save(); render(); };
$("bReset").onclick = () => { if (confirm("مسح كل الإجابات والبدء من جديد؟")) { st = {}; save(); render(); } };
render();
</script></body></html>
