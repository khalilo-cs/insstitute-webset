ions are dependent on each other's results to create an optimized schedule.", "o": [["A", "Branch prediction"], ["B", "Data flow"], ["C", "Cache mapping"], ["D", "Bus arbitration"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Medium C. Kekula — https://medium.com/@ckekula/understanding-computer-performance-branch-prediction-31efe31cf162", "s": 0}, {"id": 21, "sec": "Ch2: Performance Issues in Computer Systems", "t": "mcq", "k": 4, "q": "Which approach helps overcome the performance imbalance between processor and DRAM speeds?", "o": [["A", "Make DRAMs wider rather than deeper"], ["B", "Reduce memory access frequency via efficient caches"], ["C", "Increase interconnect bandwidth with high-speed bus hierarchies"], ["D", "All of the above"]], "a": "D", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 2 — https://quizlet.com/60387317/cea201-unit-2-flash-cards/", "s": 0}, {"id": 22, "sec": "Ch3: Top-Level View of Computer Function & Interconnection", "t": "tf", "k": 1, "q": "On a shared bus, if two devices transmit during the same time period, their signals overlap and become garbled.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: COA Garage Bus — http://coagarage.blogspot.com/p/bus.html", "s": 0}, {"id": 23, "sec": "Ch3: Top-Level View of Computer Function & Interconnection", "t": "mcq", "k": 1, "q": "Which register specifies the address in memory for the next read or write?", "o": [["A", "MBR"], ["B", "MAR (Memory Address Register)"], ["C", "I/OAR"], ["D", "I/OBR"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet CEA Chap 3+4 — https://quizlet.com/36766615/cea-chap-34-flash-cards/", "s": 0}, {"id": 24, "sec": "Ch3: Top-Level View of Computer Function & Interconnection", "t": "mcq", "k": 2, "q": "The _____ contains the data to be written into memory or receives the data read from memory.", "o": [["A", "MAR"], ["B", "PC"], ["C", "MBR (Memory Buffer Register)"], ["D", "I/OAR"]], "a": " e is NOT a form of internal memory.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 4 — https://quizlet.com/60391758/cea201-unit-4-flash-cards/", "s": 0}, {"id": 38, "sec": "Ch4: Computer Memory System Overview", "t": "mcq", "k": 1, "q": "'Memory is organized into records and access must be made in a specific linear sequence' describes:", "o": [["A", "Sequential access (Tape)"], ["B", "Direct access (Disk)"], ["C", "Random access (RAM)"], ["D", "Associative access (Cache)"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 4 multi — https://quizlet.com/130331190/cea201-unit-4-multi-flash-cards/", "s": 0}, {"id": 39, "sec": "Ch4: Computer Memory System Overview", "t": "mcq", "k": 2, "q": "Individual blocks have a unique address based on physical location and use a shared read-write mechanism in:", "o": [["A", "Associative access"], ["B", "Direct access (Magnetic Disk)"], ["C", "Random access"], ["D", "Sequential access"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 4 multi — https://quizlet.com/130331190/cea201-unit-4-multi-flash-cards/", "s": 0}, {"id": 40, "sec": "Ch4: Computer Memory System Overview", "t": "mcq", "k": 3, "q": "Going down the memory hierarchy (Registers -> Cache -> Main Memory -> Disk -> Tape) results in:", "o": [["A", "Decreasing cost/bit, increasing capacity, increasing access time"], ["B", "Increasing cost/bit and decreasing capacity"], ["C", "Decreasing access time"], ["D", "Higher transfer rate"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet Ch4 COA — https://quizlet.com/sa/166830635/ch4-computer-architecture-flash-cards/", "s": 0}, {"id": 41, "sec": "Ch4: Computer Memory System Overview", "t": "mcq", "k": 4, "q": "A portion of main memory used as a buffer to hold data temporarily for disk transfers is called a:", "o": [["A", "Disk cache"], ["B", "Register file"], ["C", "Virtual address"], ["D", "TLB"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 4 multi — https://quizlet.com/130331190/cea201-unit-4-multi-flash-cards/", "s": 0}, {"id": 42, "sec": "Ch4: Computer Memory System Overview", "t": "mcq", "k": 5, "q": "Registers are managed by the _____, Cache by _____, and Main Memory by _____.", "o": [["A", "Compiler; Processor hardware; Operating system (OS)"], ["B", "OS; Compiler; User"], ["C", "Hardware; OS; Compiler"], ["D", "User; OS; Hardware"]], "a": "A", "x": "", "n": "", "r": "Source in the file: ManaTutor Memory — https://www.manatutor.com/show.php/list-and-explain-the-different-characteristics-of-memory-system?id=209", "s": 0}, {"id": 43, "sec": "Ch5: Cache Memory Principles", "t": "tf", "k": 1, "q": "A Logical Cache sits between the processor and MMU (uses virtual addresses), whereas a Physical Cache sits between the MMU and main memory (uses physical addresses).", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Quizlet Ch4 Cache — https://quizlet.com/309564861/chapter-4-computer-memory-system-overview-cache-memory-flash-cards/", "s": 0}, {"id": 44, "sec": "Ch5: Cache Memory Principles", "t": "tf", "k": 2, "q": "In a two-level cache, L1 is internal (on-chip) and usually split (instruction/data), while L2 is external/higher level and unified.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 4 — https://quizlet.com/130331190/cea201-unit-4-multi-flash-cards/", "s": 0}, {"id": 45, "sec": "Ch5: Cache Memory Principles", "t": "mcq", "k": 1, "q": "Each cache line includes a _____ that identifies which main-memory block is currently stored in that line.", "o": [["A", "Hit bit"], ["B", "Tag"], ["C", "Page table"], ["D", "Sector"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 4 multi — https://quizlet.com/130331190/cea201-unit-4-multi-flash-cards/", "s": 0}, {"id": 46, "sec": "Ch5: Cache Memory Principles", "t": "mcq", "k": 2, "q": "_____ is the simplest mapping technique and maps each block of main memory into only one possible cache line.", "o": [["A", "Direct mapping"], ["B", "Associative mapping"], ["C", "Set-associative mapping"], ["D", "Virtual mapping"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 4 multi — https://quizlet.com/130331190/cea201-unit-4-multi-flash-cards/", "s": 0}, {"id": 47, "sec": "Ch5: Cache Memory Principles", "t": "mcq", "k": 3, "q": "In _____ mapping, cache lines are grouped into v sets of k lines (m = v x k), and each memory block maps to one unique set (any line in that set).", "o": [["A", "Direct"], ["B", "Fully associative"], ["C", "Set-associative"], ["D", "Sequential"]], "a": "C", "x": "", "n": "", "r": "Source in the file: CliffsNotes Cache — https://www.cliffsnotes.com/study-notes/22311893", "s": 0}, {"id": 48, "sec": "Ch5: Cache Memory Principles", "t": "mcq", "k": 4, "q": "Which mapping technique needs NO replacement algorithm because each block has only one fixed cache line?", "o": [["A", "Associative"], ["B", "Set-associative"], ["C", "Direct mapping"], ["D", "All of them"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Studocu Cache Principles — https://www.studocu.com/in/document/trident-academy-of-technology/computer-science/cache-memory-principles-understanding-design-and-functionality/139286339", "s": 0}, {"id": 49, "sec": "Ch5: Cache Memory Principles", "t": "mcq", "k": 5, "q": "Which replacement algorithm replaces the block in the set that has been in the cache longest with NO reference to it, and is the most popular?", "o": [["A", "FIFO"], ["B", "LFU"], ["C", "Least Recently Used (LRU)"], ["D", "Random"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Quizlet Ch4 Cache — https://quizlet.com/309564861/chapter-4-computer-memory-system-overview-cache-memory-flash-cards/", "s": 0}, {"id": 50, "sec": "Ch5: Cache Memory Principles", "t": "mcq", "k": 6, "q": "Which replacement algorithm replaces the block with the fewest references using a counter on each line?", "o": [["A", "LRU"], ["B", "FIFO"], ["C", "Least Frequently Used (LFU)"], ["D", "Random"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Studocu Tutorial 4 — https://www.studocu.com/my/document/universiti-malaya/computer-system-architecture/tutorial-4/61952186", "s": 0}, {"id": 51, "sec": "Ch5: Cache Memory Principles", "t": "mcq", "k": 7, "q": "With the _____ write policy, updates are made only in the cache (minimizing memory writes), making parts of main memory invalid.", "o": [["A", "Write-through"], ["B", "Write-back"], ["C", "Write-once"], ["D", "Read-only"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Studocu Cache Concepts — https://www.studocu.com/en-us/document/stanford-university/advanced-topics-in-computer-architecture-polymorphic-processors/organization-and-architecture-9/61474755", "s": 0}, {"id": 52, "sec": "Ch6: Internal Memory", "t": "tf", "k": 1, "q": "DRAM is simpler, smaller, denser, and cheaper than SRAM (used for main memory), whereas SRAM is faster and used for cache.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Ques10 SRAM vs DRAM — https://www.ques10.com/p/10049/compare-sram-dram-1/", "s": 0}, {"id": 53, "sec": "Ch6: Internal Memory", "t": "tf", "k": 2, "q": "The three methods for adding bits to detect single-bit errors are Parity Method, Cyclic Redundancy Check (CRC), and Hamming Code.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: TutorialsPoint Error Correction — https://www.tutorialspoint.com/article/what-is-error-correction", "s": 0}, {"id": 54, "sec": "Ch6: Internal Memory", "t": "tf", "k": 3, "q": "Cache DRAM (CDRAM) integrates a small SRAM cache (16 Kb) onto a generic DRAM chip to serve as a true cache or serial buffer.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 5 vel)"], ["D", "Cannot be erased"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Ebrary EPROM — https://ebrary.net/206226/computer_science/eprom_erasable_prom", "s": 0}, {"id": 60, "sec": "Ch6: Internal Memory", "t": "mcq", "k": 6, "q": "With _____, a section of memory cells is erased electrically in a single action ('flash' / block-level), and it is intermediate between EPROM and EEPROM in cost.", "o": [["A", "Flash memory"], ["B", "SDRAM"], ["C", "DRAM"], ["D", "PROM"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 5 multi — https://quizlet.com/130331280/cea201-unit-5-multi-flash-cards/", "s": 0}, {"id": 61, "sec": "Ch6: Internal Memory", "t": "mcq", "k": 7, "q": "In _____ memory, DRAM chips are grouped into K banks that can service K read/write requests simultaneously.", "o": [["A", "Associative"], ["B", "Interleaved"], ["C", "Virtual"], ["D", "Optical"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 5 — https://quizlet.com/60391972/cea201-unit-5-flash-cards/", "s": 0}, {"id": 62, "sec": "Ch6: Internal Memory", "t": "mcq", "k": 8, "q": "_____ are permanent physical defects (stuck at 0/1) from manufacturing/environmental abuse, whereas _____ are random nondestructive events from power supply problems.", "o": [["A", "Hard failures; Soft errors"], ["B", "Soft errors; Hard failures"], ["C", "Parity; CRC"], ["D", "Misses; Hits"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 5 multi — https://quizlet.com/130331280/cea201-unit-5-multi-flash-cards/", "s": 0}, {"id": 63, "sec": "Ch6: Internal Memory", "t": "mcq", "k": 9, "q": "_____ moves data in and out under the control of the system clock without imposing wait states.", "o": [["A", "Asynchronous DRAM"], ["B", "SDRAM (Synchronous DRAM)"], ["C", "EPROM"], ["D", "ROM"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 5 multi — https://quizlet.com/130331280/cea201-unit-5-multi-flash-cards/", "s": 0}, {"id": 64, "sec": "Ch6: Internal Memory", "t": "mcq", "k": 10, "q": "_____ sends data twice per clock cycle using both the rising and falling edges of the clock.", "o": [["A", "CDRAM"], ["B", "SDRAM"], ["C", "DDR-SDRAM"], ["D", "SRAM"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 5 multi — https://quizlet.com/130331280/cea201-unit-5-multi-flash-cards/", "s": 0}, {"id": 65, "sec": "Ch7: External Memory", "t": "tf", "k": 1, "q": "The internal components of an SSD architecture are Interface, Controller, Addressing, Data buffer/ cache, Error correction, and Flash memory components.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Studocu Storage Devices — https://www.studocu.com/row/document/kenyatta-university/computer-programming/form-1-notes-storage-devices/168051058", "s": 0}, {"id": 66, "sec": "Ch7: External Memory", "t": "mcq", "k": 1, "q": "Reduction in surface defects, better stiffness, and better shock/damage resistance are benefits of using _____ on a magnetic disk.", "o": [["A", "Magnetic heads"], ["B", "Aluminum alloy"], ["C", "Glass substrate"], ["D", "Optical laser"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 6 multi — https://quizlet.com/133384791/cea201-unit-6-multi-flash-cards/", "s": 0}, {"id": 67, "sec": "Ch7: External Memory", "t": "mcq", "k": 2, "q": "Each disk surface consists of concentric rings called _____, and each of those consists of _____ separated by gaps.", "o": [["A", "Sectors; Tracks"], ["B", "Tracks; Sectors"], ["C", "Spindles; Platters"], ["D", "Cylinders; Arms"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet COMP 7300 Ch6 — https://quizlet.com/844097451/comp-7300-chapter-6-external-memory-flash-cards/", "s": 0}, {"id": 68, "sec": "Ch7: External Memory", "t": "mcq", "k": 3, "q": "A _____ disk has one read/write head per track, whereas a _____ disk has one read/write head per surface on a radial arm.", "o": [["A"  is unknown.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Studocu Ch14 Review — https://www.studocu.com/row/document/south-east-european-university/computer-architecture/chapter-xiv-instruction-sets-addressing-modes-and-formats/44778232", "s": 0}, {"id": 73, "sec": "Ch14: Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 1, "q": "In _____ addressing (Operand = A), the operand is inside the instruction itself, used to initialize registers to a constant value.", "o": [["A", "Immediate"], ["B", "Direct"], ["C", "Indirect"], ["D", "Stack"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 13 multi — https://quizlet.com/133385622/cea201-unit-13-multi-flash-cards/", "s": 0}, {"id": 74, "sec": "Ch14: Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 2, "q": "In _____ addressing )EA = (A)(, the address field points to a memory location containing the effective address of the operand (used to implement pointers).", "o": [["A", "Direct"], ["B", "Indirect"], ["C", "Register"], ["D", "Immediate"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet Ch14 Addressing — https://quizlet.com/503607740/ch-14-instruction-sets-addressing-modes-and-formats-flash-cards/", "s": 0}, {"id": 75, "sec": "Ch14: Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 3, "q": "The advantages of _____ addressing (EA = R) are a small address field and no time-consuming memory references.", "o": [["A", "Direct"], ["B", "Indirect"], ["C", "Register"], ["D", "Displacement"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 13 multi — https://quizlet.com/133385622/cea201-unit-13-multi-flash-cards/", "s": 0}, {"id": 76, "sec": "Ch14: Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 4, "q": "_____ addressing )EA = A + (R)( combines direct and register indirect capabilities and includes Relative, Base-register, and Indexing.", "o": [["A", "Immed eld in the instruction format determines which addressing mode is to be used.", "o": [["A", "Opcode"], ["B", "Mode"], ["C", "Status"], ["D", "Parity"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet CEA Unit 13 — https://quizlet.com/86641740/cea-unit-13-flash-cards/", "s": 0}, {"id": 81, "sec": "Ch14: Instruction Sets: Addressing Modes & Formats", "t": "mcq", "k": 9, "q": "Which 6 interrelated factors determine the allocation of addressing bits?", "o": [["A", "Number of addressing modes & Number of operands"], ["B", "Register vs memory & Number of register sets"], ["C", "Address range & Address granularity"], ["D", "All of the above"]], "a": "D", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 13 multi — https://quizlet.com/133385622/cea201-unit-13-multi-flash-cards/", "s": 0}, {"id": 82, "sec": "Ch16: Processor Structure and Function", "t": "tf", "k": 1, "q": "Inside the CPU, the four blocks of the ALU are Status Flags, Shifter, Complementer, and Arithmetic & Boolean Logic.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Medium COA Part 2 — https://medium.com/@ckekula/computer-architecture-for-beginners-part-2-ae5015f34876", "s": 0}, {"id": 83, "sec": "Ch16: Processor Structure and Function", "t": "tf", "k": 2, "q": "Write After Read (WAR) is called antidependency, and Write After Write (WAW) is called output dependency.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "Source in the file: Quizlet Data Hazards — https://quizlet.com/351965635/types-of-data-hazard-flash-cards/", "s": 0}, {"id": 84, "sec": "Ch16: Processor Structure and Function", "t": "mcq", "k": 1, "q": "_____ registers enable the assembly programmer to minimize main memory references by optimizing register use.", "o": [["A", "User-visible"], ["B", "Control and status"], ["C", "MBR"], ["D", "I/OAR"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet OS Ch1 — https://quizlet.com/22693674 ": 89, "sec": "Ch16: Processor Structure and Function", "t": "mcq", "k": 6, "q": "A _____ hazard occurs when two or more instructions already in the pipeline need the same hardware resource at the same time.", "o": [["A", "Data"], ["B", "Control"], ["C", "Resource (Structural)"], ["D", "Branch"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Quizlet Adv Comp Arch — https://quizlet.com/552822799/advanced-computer-architecture-exam-3-flash-cards/", "s": 0}, {"id": 90, "sec": "Ch16: Processor Structure and Function", "t": "mcq", "k": 7, "q": "Which Data Hazard is 'true dependency' (an instruction modifies a register/memory and the next instruction reads it before the write finishes)?", "o": [["A", "Read After Write (RAW)"], ["B", "Write After Read (WAR - antidependency)"], ["C", "Write After Write (WAW - output dependency)"], ["D", "RAR"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet Data Hazards — https://quizlet.com/351965635/types-of-data-hazard-flash-cards/", "s": 0}, {"id": 91, "sec": "Ch16: Processor Structure and Function", "t": "mcq", "k": 8, "q": "A _____ hazard (branch hazard) occurs when the pipeline makes a wrong decision on a branch prediction and must discard fetched instructions.", "o": [["A", "Resource"], ["B", "Data"], ["C", "Control"], ["D", "Structural"]], "a": "C", "x": "", "n": "", "r": "Source in the file: Vaia Pipeline Hazards — https://www.vaia.com/en-us/explanations/computer-science/computer-organisation-and-architecture/pipeline-hazards/", "s": 0}, {"id": 92, "sec": "Ch16: Processor Structure and Function", "t": "mcq", "k": 9, "q": "Which branch technique uses a small, fast memory in the instruction fetch stage to store loop instructions without accessing main memory?", "o": [["A", "Multiple streams"], ["B", "Loop buffer"], ["C", "Delayed branch"], ["D", "Prefetch branch target"]], "a": "B", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 14 multi — https://quizlet.com/133385666/cea201-unit-14-multi-flash-cards/", "s": 0}, {"id": 93, "sec": "Ch16: Processor Structure and Function", "t": "mcq", "k": 10, "q": "Which branch technique fetches instructions from more than one possible branch path at the same time?", "o": [["A", "Multiple streams"], ["B", "Loop buffer"], ["C", "Delayed branch"], ["D", "Static branch"]], "a": "A", "x": "", "n": "", "r": "Source in the file: Quizlet CEA201 Unit 14 multi — https://quizlet.com/133385666/cea201-unit-14-multi-flash-cards/", "s": 0}, {"id": 94, "sec": "Ch16: Processor Structure and Function", "t": "mcq", "k": 11, "q": "In _____ branch, the processor always executes the instruction immediately after the branch (the delay slot) before the branch takes effect.", "o": [["A", "Multiple streams"], ["B", "Prefetch branch target"], ["C", "Loop buffer"], ["D", "Delayed branch"]], "a": "D", "x": "", "n": "", "r": "Source in the file: Quizlet Pipeline — https://quizlet.com/108142741/computer-achitechure-pipeline-flash-cards/", "s": 0}];
const KEY = "coa_bank2_v1"; let st = {};
try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { st = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nz = s => String(s).toLowerCase().replace(/[^a-z0-9]/g, "");
const TL = {tf:"صح / خطأ", mcq:"اختيار من متعدد", fib:"أكمل الفراغ"};
const SECS = [...new Set(DATA.map(q => q.sec))];
$("fSec").innerHTML = '<option value="">كل الأقسام</option>' + SECS.map((s,i) => `<option value="${i}">${esc(s)} (${DATA.filter(q=>q.sec===s).length})</option>`).join("");
const shown = () => DATA.filter(q => (!$("fSec").value || q.sec === SECS[+$("fSec").value]) && (!$("fType").value || q.t === $("fType").value));
const isRight = (q, s) => q.t === "fib" ? (s.manual === true || (s.pick && fibOk(q, s.pick))) : s.pick === q.a;
function fibOk(q, v){ const a = nz(q.a), u = nz(v); if (!u) return false; return u === a || (u.length >= 4 && (a.includes(u) || u.includes(a))); }
function render(){
  const L = shown(); $("sTot").textContent = L.length;
  $("list").innerHTML = L.map(q => {
    const s = st[q.id] || {}, locked = !!s.checked;
    let inner = "";
    if (q.t === "fib") inner = `<div class="fib"><input type="text" data-id="${q.id}" value="${esc(s.pick||"")}" ${locked?"disabled":""} placeholder="اكتب إجابتك"></div>`;
    else inner = '<div class="opts">' + q.o.map(([l,t]) => { let c = "o"; if (s.pick === l) c += " sel"; if (locked && l === q.a) c += " right"; if (locked && s.pick === l && l !== q.a) c += " wrong";
      return `<label class="${c}"><input type="radio" name="q${q.id}" value="${l}" data-id="${q.id}" ${s.pick===l?"checked":""} ${locked?"disabled":""}><b>${q.t==="tf"?"":l+"."}</b><span>${esc(t)}</span></label>`; }).join("") + "</div>";
    let fb = "";
    if (locked) { const ok = isRight(q, s); const at = q.t==="fib" ? q.a : (q.t==="tf" ? (q.a==="T"?"True":"False") : q.a+". "+(q.o.find(o=>o[0]===q.a)||[0,""])[1]);
      fb = `<div class="fb ${ok?"ok":"bad"}"><div class="t">${ok?"✓ إجابة صحيحة":"✗ إجابة خاطئة"} — الإجابة: <span dir="ltr">${esc(at)}</span></div>${q.x?`<div>${esc(q.x)}</div>`:""}${q.n?`<div class="warn">${esc(q.n)}</div>`:""}
      ${q.s?'<div class="warn">هذه الإجابة من حلّي أنا (Claude) لأنها غير معلَّمة في ملف الدكتورة.</div>':""}<div class="meta">${esc(q.r||"")}</div>
      ${(!ok && q.t==="fib")?`<button class="sec" data-man="${q.id}">احسبها صحيحة</button>`:""}</div>`; }
    return `<div class="q ${locked?"locked":""}" id="q${q.id}"><div class="tag">${esc(q.sec)} · ${TL[q.t]}</div><div class="qh"><span class="num">${q.k}</span><span>${esc(q.q)}</span></div>${inner}
      <div class="actions"><button data-chk="${q.id}" ${(!s.pick||locked)?"disabled":""}>تحقق</button></div>${fb}</div>`; }).join("");
  stats();
}
function stats(){ const L = shown(); let chk=0, sc=0;
  L.forEach(q => { const s = st[q.id]||{}; if (s.checked){ chk++; if (isRight(q,s)) sc++; } });
  $("sChk").textContent = chk; $("sScore").textContent = sc; $("sChk2").textContent = chk; $("pr").style.width = (L.length ? chk/L.length*100 : 0) + "%";
  const r = $("res"); if (L.length && chk === L.length) { r.classList.remove("hidden"); r.innerHTML = `<b>النتيجة النهائية للمعروض: ${sc} / ${L.length} (${Math.round(sc/L.length*100)}%)</b>`; } else r.classList.add("hidden"); }
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.id && t.type === "radio") { st[t.dataset.id] = Object.assign(st[t.dataset.id]||{}, {pick:t.value}); save(); render(); } });
document.addEventListener("input", e => { const t = e.target; if (t.dataset && t.dataset.id && t.type === "text") { st[t.dataset.id] = Object.assign(st[t.dataset.id]||{}, {pick:t.value}); save(); const b = document.querySelector(`[data-chk="${t.dataset.id}"]`); if (b) b.disabled = !t.value.trim(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-chk]"); if (b) { const id = b.dataset.chk; if ((st[id]||{}).pick) { st[id].checked = true; save(); render(); } return; }
  const m = e.target.closest("[data-man]"); if (m) { st[m.dataset.man].manual = true; save(); render(); } });
["fSec","fType"].forEach(i => $(i).onchange = render);
$("bAll").onclick = () => { shown().forEach(q => { const s = st[q.id]; if (s && s.pick) s.checked = true; }); save(); render(); };
$("bRetry").onclick = () => { shown().forEach(q => { const s = st[q.id]; if (s && s.checked && !isRight(q,s)) delete st[q.id]; }); save(); render(); };
$("bReset").onclick = () => { if (confirm("مسح كل الإجابات والبدء من جديد؟")) { st = {}; save(); render(); } };
render();
</script></body></html>
