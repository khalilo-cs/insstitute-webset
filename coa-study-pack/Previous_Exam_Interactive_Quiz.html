<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>COA Exam Quiz</title>
<style>
:root{--bg:#f4f7f9;--card:#fff;--ink:#14212b;--mut:#5a6b78;--line:#d3dde4;--acc:#0b6a85;--ok:#0a7a3a;--okbg:#e3f6e8;--bad:#b3261e;--badbg:#fde8e6;--warn:#7a5200;--warnbg:#fff3cd;--sel:#e3f1f7}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10181e;--card:#18232b;--ink:#e6eef3;--mut:#9fb2bf;--line:#2c3c47;--acc:#4cb7d6;--ok:#66d28f;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18;--warn:#ffd36b;--warnbg:#3a2f12;--sel:#1d3340}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Tahoma,"DejaVu Sans",sans-serif;line-height:1.6}
.wrap{max-width:820px;margin:0 auto;padding:16px}
header{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:1.25rem;margin:0 0 6px;color:var(--acc)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.9rem}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc);width:0}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:6px 14px}
button.sec{background:transparent;color:var(--acc)}button:disabled{opacity:.45;cursor:not-allowed}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}
.qh{display:flex;gap:10px;direction:ltr;align-items:flex-start;font-weight:600}
.num{background:var(--acc);color:#fff;border-radius:6px;padding:0 8px;min-width:28px;text-align:center}
.opts{margin:10px 0;display:grid;gap:6px;direction:ltr}
label.o{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;text-align:left}
label.o:hover{background:var(--sel)}label.o.sel{background:var(--sel);border-color:var(--acc)}
label.o b{color:var(--acc);min-width:18px}
label.o.right{background:var(--okbg);border-color:var(--ok)}label.o.wrong{background:var(--badbg);border-color:var(--bad)}
.locked label.o{cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.fb{margin-top:10px;border-radius:8px;padding:8px 12px}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.fb .t{font-weight:700}.fb .ex{margin-top:4px}
.warn{margin-top:6px;background:var(--warnbg);color:var(--warn);border-radius:6px;padding:4px 10px;font-size:.92rem}
.meta{color:var(--mut);font-size:.82rem;margin-top:4px}
.res{background:var(--card);border:2px solid var(--acc);border-radius:10px;padding:14px;margin:14px 0}
.res h2{margin:0 0 6px}.hidden{display:none}
.note{color:var(--mut);font-size:.9rem}
</style></head><body><div class="wrap">
<header>
<h1>اختبار تفاعلي — امتحان معمارية الحاسوب النهائي (2024–2025)</h1>
<div class="bar">
<span class="stat">تمت الإجابة: <b id="sAns">0</b>/<span id="sTot"></span></span>
<span class="stat">تم التصحيح: <b id="sChk">0</b></span>
<span class="stat">النتيجة: <b id="sScore">0</b>/<b id="sChk2">0</b></span>
<button id="bAll">تصحيح الكل / إنهاء</button>
<button id="bRetry" class="sec">إعادة محاولة الأخطاء</button>
<button id="bReset" class="sec">إعادة ضبط الكل</button>
</div><div class="prog"><i id="pr"></i></div>
</header>
<p class="note">اختر إجابتك ثم اضغط «تحقق». الإجابات والشرح مخفية حتى تتحقق. الأجوبة حل مبني على ملفات المحاضرة وليست مفتاحاً رسمياً؛ الأسئلة الموسومة بتحذير ⚠ فيها غموض في الأصل. يعمل الملف دون إنترنت.</p>

<script>
const DATA = [{"n": 1, "q": "Hard Disks Drives (HDD) use:", "o": [["B", "Optical discs"], ["D", "The mixture of glass and ceramic"], ["A", "Flash memory"], ["C", "Magnetic disks"]], "a": "C", "c": "high", "x": "الـ HDD يخزّن البيانات على أقراص مغناطيسية (Magnetic disks) أي platters مغطاة بطبقة ممغنطة. Flash = تقنية SSD، وOptical = CD/DVD/Blu-ray. أما «خليط الزجاج والسيراميك» فهو مادة صنع الـ platter وليس نوع التخزين الذي يستخدمه القرص.", "f": "الخيار D (glass and ceramic) صحيح جزئياً كمادة للـ platter؛ اخترنا C لأنه الأدق لسؤال «use».", "r": "Ch7 §1"}, {"n": 2, "q": "Superscalar execution can increase the number of instructions executed per clock cycle", "o": [["A", "TRUE."], ["B", "FALSE."]], "a": "A", "c": "high", "x": "Superscalar = قدرة المعالج على إصدار عدة تعليمات مستقلة في كل clock cycle باستخدام عدة pipelines متوازية، لذلك تزيد عدد التعليمات المنفَّذة لكل دورة. العبارة صحيحة.", "f": "", "r": "Ch2 §3"}, {"n": 3, "q": "The error correction function has results:", "o": [["B", "All statements are TRUE.."], ["A", "No errors are detected."], ["C", "An error is detected, and it is possible to correct the error."], ["D", "An error is detected, but it is not possible to correct it."]], "a": "B", "c": "high", "x": "عند القراءة تُقارَن الـ code الجديد بالمخزَّن فتظهر ثلاث نتائج: (1) لا خطأ، (2) خطأ مكتشف ويمكن تصحيحه، (3) خطأ مكتشف لا يمكن تصحيحه. إذن كل العبارات صحيحة.", "f": "", "r": "Ch6 §9 (Figure 5)"}, {"n": 4, "q": "Recently, manufacturers still rely on Moore's Law to improve computer performance.", "o": [["A", "TRUE."], ["B", "FALSE."]], "a": "B", "c": "low", "x": "قانون Moore يصف زيادة عدد الترانزستورات (ما زال مستمراً)، لكن تحسين الأداء حالياً لا يعتمد على رفع تردد الساعة (clock rate) بل على تغيير تنظيم ومعمارية المعالج: multicore وMIC وGPU وpipelining وغيرها. لذلك الإجابة المرجّحة: FALSE.", "f": "⚠ غير مؤكد: صيغة السؤال غامضة وليست في الملفات حرفياً. الإجابة FALSE هي الأرجح بحسب سياق Ch2، لكن إن كانت شريحة المحاضِرة تقول عكس ذلك فاعتمد شريحتها.", "r": "Ch1 §7.3 + Ch2 §5 + مراجع خارجية"}, {"n": 5, "q": "The Control Unit contains:", "o": [["C", "Control unit registers"], ["A", "All statements are TRUE."], ["D", "Sequencing logic"], ["B", "Decoders"]], "a": "A", "c": "medium", "x": "وحدة التحكم Control Unit تتألف من: Control unit registers وdecoders وsequencing logic (وفي النوع microprogrammed توجد أيضاً control memory). كل الخيارات الثلاثة صحيحة، فالجواب «All statements are TRUE».", "f": "هذه النقطة غير موجودة في ملفات الفصول المرفقة؛ الجواب مبني على كتاب Stallings (التفاصيل بحسب نوع الـ control unit).", "r": "Stallings (غير مذكور في الملخصات)"}, {"n": 6, "q": "The main difference between Many Integrated Core (MIC) Graphics Processing Unit (GPU):", "o": [["D", "The number of cores"], ["C", "Their power consumption"], ["B", "The type of tasks they are designed for"], ["A", "Their size"]], "a": "B", "c": "high", "x": "MIC = عدد كبير من معالجات عامة الغرض متجانسة (general-purpose) على شريحة واحدة، بينما GPU صُمّمت أصلاً لمعالجة الرسوميات. الفرق الرئيسي إذن هو نوع المهام التي صُمّم لها كل منهما.", "f": "صياغة السؤال ناقصة (كلمة «and»/«vs» بين MIC وGPU مفقودة)؛ فهمناه كمقارنة بين الاثنين.", "r": "Ch2 §7-8"}, {"n": 7, "q": "Static RAM (SRAM) uses the same logic elements as:", "o": [["C", "The processor"], ["B", "All statements are FALSE.."], ["A", "The I/O devices"], ["D", "The disk"]], "a": "C", "c": "high", "x": "SRAM جهاز رقمي يخزّن البت بدارات flip-flop من بوابات منطقية، وهي نفس العناصر المنطقية المستخدمة في المعالج (the processor).", "f": "", "r": "Ch6 §3"}, {"n": 8, "q": "Computer systems contain many different_______", "o": [["D", "Buses."], ["B", "Lines."], ["C", "All statements are TRUE.."], ["A", "Control signal."]], "a": "D", "c": "high", "x": "النص في المحاضرة: «Computer systems contain many different buses». الـ Lines (خطوط) هي مكوّنات داخل الـ bus، والـ control signal نوع من الخطوط وليس ما يحتويه النظام بكثرة بهذه الصيغة.", "f": "", "r": "Ch3 §7"}, {"n": 9, "q": "Dynamic RAM (DRAM) requires periodic charge refreshing to:", "o": [["C", "Maintain data storage"], ["B", "Increase speed"], ["A", "All statements are FALSE."], ["D", "Reduce power consumption"]], "a": "C", "c": "high", "x": "DRAM تخزّن البت كشحنة في مكثّف (capacitor) والشحنة تتسرّب مع الوقت، لذا يجب إعادة تنشيطها كل 10–100 ms من أجل الحفاظ على البيانات (Maintain data storage) — ليس لزيادة السرعة ولا لتقليل الطاقة.", "f": "", "r": "Ch6 §2"}, {"n": 10, "q": "The direct addressing mode is used to:", "o": [["C", "All statements are TRUE.."], ["B", "Access static data"], ["A", "Initialize registers to a constant value"], ["D", "For records implementation"]], "a": "B", "c": "high", "x": "Direct addressing (EA = A) يُستخدم للوصول إلى البيانات الثابتة (static data) ولتنفيذ المتغيرات. تهيئة الـ registers بقيمة ثابتة = Immediate، وتنفيذ السجلات (records) = Index addressing.", "f": "", "r": "Ch14 §9"}, {"n": 11, "q": "Addressing modes can be used to:", "o": [["C", "Neither Simplify instruction encoding nor Improve program efficiency"], ["A", "Simplify instruction encoding"], ["B", "Improve program efficiency"], ["D", "Both Simplify instruction encoding and Improve program efficiency"]], "a": "D", "c": "medium", "x": "أنماط العنونة تمنح المبرمج مرونة (مؤشرات، عدّادات حلقات، فهرسة، إعادة تموضع البرنامج) وتقلّل عدد بتات حقل العنوان في التعليمة، أي تبسّط ترميز التعليمة وتحسّن كفاءة البرنامج. إذن D.", "f": "الجملة غير موجودة حرفياً في الملخصات؛ D هو الخيار الأشمل والأقرب لمنطق Ch14.", "r": "مرجع Stallings (غير مذكور حرفياً)"}, {"n": 12, "q": "The Complementer is used for:", "o": [["B", "Shifting data left or right"], ["D", "Controlling the flow of data"], ["C", "Performing arithmetic operations"], ["A", "Performing logical operations"]], "a": "C", "c": "medium", "x": "الـ Complementer داخل الـ ALU يولّد المتمّم (complement) للرقم، ويُستخدم أساساً في العمليات الحسابية (مثل الطرح بطريقة المتمّم الثنائي 2's complement). التحريك = Shifter، وتدفق البيانات = Control Unit.", "f": "⚠ متوسط الثقة: المتمّم قد يُعتبر أيضاً عملية منطقية (NOT)، لكن دوره في الـ ALU عادةً حسابي. اخترنا C.", "r": "Ch16 §1"}, {"n": 13, "q": "Architectural attributes have a direct impact on the logical execution of a program.", "o": [["A", "TRUE."], ["B", "FALSE."]], "a": "A", "c": "high", "x": "Architecture = الخصائص المرئية للمبرمج (instruction set، أنواع البيانات، I/O، تقنيات العنونة)، ولها أثر مباشر على التنفيذ المنطقي للبرنامج. أما Organization فتفاصيل شفافة للمبرمج. العبارة صحيحة.", "f": "", "r": "Ch1 §4"}, {"n": 14, "q": "Conditional branch instructions can:", "o": [["B", "Produces an incorrect result."], ["D", "Limit pipelining performance"], ["C", "Improve pipelining performance"], ["A", "Do not affect pipelining performance"]], "a": "D", "c": "high", "x": "التعليمة الشرطية conditional branch قد تُبطل عدة instruction fetches (لأن التعليمات المجلوبة قد تكون خاطئة)، فتحدّ من أداء الـ pipeline. وهي من العوامل الثلاثة المحدِّدة: اختلاف مدة المراحل، conditional branch، والمقاطعة.", "f": "الخيار B مكتوب بصيغة نحوية غير سليمة («Produces») لكنه خاطئ على أي حال.", "r": "Ch16 §4"}, {"n": 15, "q": "The memory hierarchy is based on the principle that:", "o": [["A", "Memory speed and cost are related."], ["D", "All statements are TRUE.."], ["B", "Faster memory is more expensive."], ["C", "Slower memory is a large."]], "a": "D", "c": "medium", "x": "مبدأ الـ hierarchy: الأسرع = أغلى لكل بت، والأكبر سعة = أرخص لكل بت وأبطأ. الخياران A وB صحيحان، وC يُفهم كـ «الذاكرة الأبطأ أكبر (سعة)» وهو صحيح أيضاً. لذلك D.", "f": "⚠ الخيار C مكتوب بشكل ناقص/غير مفهوم («Slower memory is a large.») — افترضنا أنه «larger». إن لم يكن هذا مقصوده فالأقرب B أو A.", "r": "Ch4 §3"}, {"n": 16, "q": "The address field references the main memory address and the referenced register contains a positive displacement from that address.", "o": [["A", "Stack addressing."], ["D", "Indexing addressing."], ["B", "Base-register addressing."], ["C", "Relative addressing."]], "a": "D", "c": "high", "x": "في Indexing: حقل العنوان A يحمل عنوان الذاكرة الرئيسية والـ register (index register) يحمل الإزاحة الموجبة (EA = A + (R))، ويُستخدم في الحلقات والمصفوفات. أما Base-register فالعكس: الـ register يحمل عنوان الذاكرة والحقل يحمل الإزاحة.", "f": "انتبه: النصان متشابهان في الكتب؛ هذه الصياغة بالذات (address field = memory address + register = displacement) هي Indexing في ملخص Ch14.", "r": "Ch14 §7.3"}, {"n": 17, "q": "Increasing the interconnect bandwidth can improve:", "o": [["A", "Processor speeds"], ["C", "All statements are TRUE."], ["D", "Data transfer speed."], ["B", "All statements are FALSE."]], "a": "D", "c": "medium", "x": "رفع الـ interconnect bandwidth بين المعالج والذاكرة (buses أسرع وهرمية buses) يحسّن سرعة نقل البيانات (data transfer speed) ويقلّل الفجوة بين الذاكرة والمعالج، ولا يرفع سرعة المعالج نفسه.", "f": "⚠ متوسط الثقة: صيغة السؤال مقتضبة. A غير دقيق لأن سرعة المعالج تتحدد بالساعة والتصميم.", "r": "Ch2 §4"}, {"n": 18, "q": "Types of pipeline hazards:", "o": [["D", "Control"], ["A", "Data"], ["C", "All statements are TRUE"], ["B", "Resource"]], "a": "C", "c": "high", "x": "أنواع الـ pipeline hazards ثلاثة: Resource وData وControl. كلها صحيحة، فالجواب «All statements are TRUE».", "f": "", "r": "Ch16 §5"}, {"n": 19, "q": "Each platter has:", "o": [["A", "Four surfaces"], ["C", "All statements are FALSE.."], ["B", "Two surfaces"], ["D", "Three surfaces"]], "a": "B", "c": "high", "x": "كل platter له سطحان (two surfaces)، وكل surface مقسّم إلى tracks ثم sectors.", "f": "", "r": "Ch7 §1"}, {"n": 20, "q": "Used by the control unit to control the operation of the processor.", "o": [["B", "Program Status Word (PSW)"], ["C", "Control Registers"], ["A", "User-Visible Registers"], ["D", "All statements are TRUE."]], "a": "C", "c": "medium", "x": "الـ Control and Status Registers تُستخدم من قبل الـ control unit للتحكم بعمل المعالج (ومن قبل برامج نظام التشغيل). User-Visible Registers تخدم المبرمج لتقليل مراجع الذاكرة، والـ PSW سجل حالة (flags).", "f": "⚠ الـ PSW جزء من Control and Status Registers، لكن الخيار الأقرب لنص الشريحة هو «Control Registers».", "r": "Ch16 §2"}, {"n": 21, "q": "Single-sided disks are more expensive than double-sided disks.", "o": [["B", "FALSE."], ["A", "TRUE."]], "a": "B", "c": "high", "x": "الأقراص أحادية الجانب (single-sided) أرخص ثمناً؛ تستخدمها أنظمة الأقراص الأقل كلفة. لذلك العبارة خاطئة.", "f": "", "r": "Ch7 §2 (Sides)"}, {"n": 22, "q": "Determine the address of the next instruction to be executed.", "o": [["D", "Instruction fetch (if)"], ["C", "Instruction operation decoding (iod)"], ["A", "Operand address calculation (oac)"], ["B", "Instruction address calculation (iac)"]], "a": "B", "c": "high", "x": "الحالة السابعة في instruction cycle: Instruction address calculation (iac) = تحديد عنوان التعليمة التالية (عادةً بإضافة عدد ثابت إلى عنوان التعليمة السابقة).", "f": "", "r": "Ch3 §3"}, {"n": 23, "q": "The future of embedded systems includes:", "o": [["C", "More powerful and capable embedded systems"], ["B", "All statements are TRUE."], ["D", "Integration with artificial intelligence"], ["A", "Increased use of the Internet of Things (IoT)"]], "a": "B", "c": "medium", "x": "الاتجاهات المستقبلية للأنظمة المضمّنة: ازدياد استخدام IoT، وأنظمة أقوى وأكثر قدرة، ودمج الذكاء الاصطناعي. الخيارات الثلاثة معقولة ولا يناقضها شيء، لذا «All statements are TRUE».", "f": "⚠ الملخصات تذكر IoT فقط؛ بقية النقاط استنتاج منطقي وليست منقولة حرفياً.", "r": "Ch1 §8-9 (جزئي)"}, {"n": 24, "q": "Associative access refers to:", "o": [["D", "Accessing data in a specific linear sequence"], ["A", "Accessing data directly based on a unique address"], ["C", "Accessing data based on a portion of its contents"], ["B", "Accessing data randomly"]], "a": "C", "c": "high", "x": "Associative access: يُسترجع الـ word اعتماداً على جزء من محتواه لا على عنوانه (مثل الـ cache). Sequential = تسلسل خطي، Direct = عنوان فريد حسب الموقع الفيزيائي، Random = أي موقع بزمن ثابت.", "f": "", "r": "Ch4 §2 (Access Method)"}, {"n": 25, "q": "The AC (Accumulator) register is used to store the intermediate results of calculations", "o": [["B", "TRUE."], ["A", "FALSE."]], "a": "B", "c": "high", "x": "الـ AC (مع MQ) يحتفظان مؤقتاً بمعاملات operands ونتائج عمليات الـ ALU. العبارة صحيحة.", "f": "", "r": "Ch1 §7.1 (IAS registers)"}, {"n": 26, "q": "The second generation of computers used:", "o": [["D", "Data channel"], ["C", "Both transistors and data channel"], ["A", "Integrated Circuits"], ["B", "Transistors"]], "a": "C", "c": "medium", "x": "الجيل الثاني استخدم الترانزستورات (Transistors) بدل الصمامات المفرّغة، وقدّم الـ data channels (وحدة I/O مستقلة لها معالج وتعليمات خاصة، مثل IBM 7094). الـ ICs من الجيل الثالث. لذلك «Both transistors and data channel».", "f": "⚠ الخيار B (Transistors) صحيح أيضاً بمفرده؛ اخترنا C لأنه يشمل ما ذكرته المحاضرة للجيل الثاني. إن كانت مفاتيح المحاضِرة تعتمد B فاعتمدها.", "r": "Ch1 §7.2"}, {"n": 27, "q": "The main difference between Solid State Drives (SSD) compared to Hard Disks Drives (HDD) is:", "o": [["B", "All statements are FALSE.."], ["A", "The data transfer rate"], ["D", "All statements are TRUE.."], ["C", "The power consumption"]], "a": "D", "c": "medium", "x": "مزايا الـ SSD على الـ HDD: أداء I/O أعلى (IOPS)، زمن وصول أقل، متانة أعلى، عمر أطول، استهلاك طاقة أقل، وهدوء وحرارة أقل. الفرق يظهر في معدل نقل البيانات/الأداء وفي استهلاك الطاقة معاً، لذا «All statements are TRUE».", "f": "⚠ «معدل نقل البيانات» لم يُذكر بهذا الاسم في الملخص (ذُكر IOPS وlatency)، لكنه من فروق الأداء المقبولة.", "r": "Ch7 §3"}, {"n": 28, "q": "Primary memory is faster and more expensive than secondary memory.", "o": [["B", "TRUE."], ["A", "FALSE."]], "a": "B", "c": "high", "x": "في الـ hierarchy: كلما صعدنا (cache، main memory) زادت السرعة وزادت الكلفة لكل بت وقلّت السعة. الذاكرة الرئيسية الأسرع والأغلى (لكل بت) من الثانوية (disk/tape). العبارة صحيحة.", "f": "", "r": "Ch4 §3"}, {"n": 29, "q": "The hardware converts virtual addresses into physical addresses via", "o": [["C", "Operating system"], ["B", "Both CPU and operating system."], ["D", "All statements are FALSE.."], ["A", "CPU"]], "a": "C", "c": "low", "x": "نص المحاضرة: «hardware converts virtual addresses into physical addresses via an OS-managed lookup table (page table)». أي أن التحويل يتم عبر جدول الصفحات الذي يديره نظام التشغيل (Operating system)، وتنفّذه وحدة MMU في العتاد.", "f": "⚠ غير مؤكد: السؤال مقتطع (المقصود غالباً «via an OS-managed lookup table / page table»). اخترنا Operating system لأنه الأقرب لهذه الجملة، لكن B قد تكون مقبولة عند البعض.", "r": "Ch5 §4 (Virtual Memory)"}, {"n": 30, "q": "Branch prediction and data flow analysis used to increase microprocessor performance are primarily focused on:", "o": [["A", "Improving the algorithms"], ["D", "Improving the hardware components"], ["B", "Improving the architecture"], ["C", "All statements are TRUE."]], "a": "B", "c": "low", "x": "هاتان التقنيتان (مع pipelining وsuperscalar وspeculative execution) من تقنيات تحسين المعالج على مستوى تنظيم/معمارية المعالج (chip organization and architecture)، لا على مستوى الخوارزميات ولا بمجرد تحسين المكوّنات الفيزيائية.", "f": "⚠ غير مؤكد: الخيارات لا تتضمن «organization» صراحةً؛ B (architecture) الأقرب. تحقّق من مفتاح المحاضِرة.", "r": "Ch2 §2-3"}, {"n": 31, "q": "The main disadvantage of the write-through policy is:", "o": [["D", "It is complex to implement"], ["B", "It reduces the cache hit rate"], ["C", "It generates large traffic"], ["A", "All statements are FALSE.."]], "a": "C", "c": "high", "x": "Write-through: كل عملية كتابة تذهب إلى الـ cache وإلى الذاكرة الرئيسية معاً؛ أبسط تقنية لكنها تولّد حركة كبيرة (substantial traffic) على الذاكرة. التعقيد هو عيب write-back.", "f": "", "r": "Ch5 §7"}, {"n": 32, "q": "The register indirect addressing mode is like the indirect addressing mode both use to:", "o": [["A", "All statements are FALSE.."], ["D", "Handle recursive procedures."], ["B", "Pass an array as a parameter."], ["C", "Initialize registers to a constant value."]], "a": "B", "c": "high", "x": "Indirect وRegister indirect يُستخدمان لتنفيذ المؤشرات (pointers) ولتمرير مصفوفة كمعامل (Pass an array as a parameter). الـ recursion = Base-register، وتهيئة قيمة ثابتة = Immediate.", "f": "", "r": "Ch14 §9"}, {"n": 33, "q": "The primary difference between computer architecture and computer organization lies in:", "o": [["A", "The hardware details"], ["B", "The operational units"], ["D", "The instruction set"], ["C", "The visibility to the programmer"]], "a": "C", "c": "medium", "x": "Architecture = الخصائص المرئية للمبرمج (visible to the programmer)، أما Organization = الوحدات التشغيلية وترابطها وتفاصيل العتاد الشفافة للمبرمج. فالفارق الأساسي هو «الرؤية/الظهور للمبرمج».", "f": "⚠ الخيارات A وB وD تخصّ تفاصيل أحد الطرفين؛ C هو معيار التمييز بين الاثنين.", "r": "Ch1 §4"}, {"n": 34, "q": "The physical characteristics of memory can be semiconductor, magnetic, optical, or magneto-optical.", "o": [["A", "TRUE."], ["B", "FALSE."]], "a": "A", "c": "high", "x": "الأنواع الفيزيائية الشائعة: semiconductor (RAM/ROM)، magnetic (disk/tape)، optical (CD/DVD)، magneto-optical. العبارة صحيحة.", "f": "ملاحظة لغوية: المحاضرة تسمّيها «Physical Type»، والسؤال يسمّيها «physical characteristics»، لكن المحتوى متطابق.", "r": "Ch4 §2 (Physical Type)"}, {"n": 35, "q": "The relationship between a core and a processor is:", "o": [["C", "A core and a processor are the same thing"], ["D", "A processor is a part of a core"], ["B", "A core is a part of a processor"], ["A", "There is no relationship between a core and a processor"]], "a": "B", "c": "high", "x": "Processor = قطعة سيليكون فيزيائية تحتوي على core واحد أو أكثر (multicore). الـ core وحدة معالجة مستقلة داخل الـ processor؛ إذن الـ core جزء من الـ processor.", "f": "في ملف الامتحان يظهر في أعلى الصفحة 5 سطر مقصوص «35* The main difference between MIC GPU» وهو بقايا تنسيق؛ تجاهلناه والسؤال الفعلي رقم 35 هو أعلاه.", "r": "Ch1 §6"}, {"n": 36, "q": "If the requested data is not found in the cache, it is called a:", "o": [["D", "All statements are FALSE.."], ["A", "Cache line"], ["C", "Hit"], ["B", "Miss"]], "a": "B", "c": "high", "x": "وجود الكلمة في الـ cache = Hit، وعدم وجودها = Miss (فيُحمَّل الـ block من الذاكرة الرئيسية). الـ cache line هو وحدة التخزين داخل الـ cache.", "f": "", "r": "Ch5 §2"}, {"n": 37, "q": "An interrupt service routine (ISR) is:", "o": [["D", "All statements are TRUE.."], ["A", "A part of the operating system"], ["B", "A program that handles interrupts"], ["C", "A hardware component -1"]], "a": "B", "c": "medium", "x": "الـ ISR (أو interrupt handler) برنامج/روتين يخدم المقاطعة؛ يُنفَّذ بعد حفظ حالة البرنامج، ثم يعود المعالج لاستئناف البرنامج المتوقف. ليس مكوّناً عتادياً، وليس بالضرورة جزءاً من نظام التشغيل (قد يكون driver أو برنامج مضمّن).", "f": "⚠ الخيار C يحتوي رمزاً غريباً «-1» (خطأ طباعي في الأصل). والخيار A قد يُعتبر صحيحاً جزئياً (كثير من الـ ISRs تتبع نظام التشغيل) لكن B هو التعريف الأدق.", "r": "Ch3 §4 + معرفة عامة"}, {"n": 38, "q": "_________written into at any time without erasing prior contents.", "o": [["D", "All statements are TRUE.."], ["C", "Electrically erasable programmable read-mostly memory (EEPROM)"], ["B", "Erasable programmable read-mostly memory (EPROM)"], ["A", "Flash Memory"]], "a": "C", "c": "high", "x": "EEPROM يمكن الكتابة فيه في أي وقت دون مسح المحتوى السابق (يُحدَّث البايت المعنيّ فقط) — يجمع عدم التطاير مع قابلية التحديث في مكانه. EPROM يحتاج مسحاً بالأشعة فوق البنفسجية على مستوى الشريحة، وFlash يُمسح على مستوى كتل (blocks).", "f": "بداية السؤال محذوفة في الأصل (فراغ في أول الجملة)، وأُكملت من نص المحاضرة.", "r": "Ch6 §7"}, {"n": 39, "q": "Acknowledges that the pending interrupt has been recognized.", "o": [["C", "Interrupt ACK"], ["B", "Bus request"], ["D", "Bus grant"], ["A", "Interrupt request"]], "a": "C", "c": "high", "x": "Interrupt ACK = إقرار بأن المقاطعة المعلّقة تم التعرّف عليها. Interrupt request = تدلّ على وجود مقاطعة معلّقة، وBus request/Bus grant متعلقان بالتحكم في الـ bus.", "f": "", "r": "Ch3 §7 (control lines)"}, {"n": 40, "q": "Permits each main memory block to be loaded into any line of the cache.", "o": [["C", "Associative Mapping"], ["D", "Both Direct and Associative"], ["A", "Direct Mapping"], ["B", "Set Associative"]], "a": "C", "c": "high", "x": "Associative mapping يسمح بتحميل أي block من الذاكرة في أي line من الـ cache (any to any) مع فحص كل الـ tags في آن واحد. Direct = line واحد ثابت، وSet associative = set واحد ثابت (وأي line داخله).", "f": "", "r": "Ch5 §5.2"}];
const CONFL = {high:"مؤكَّدة من ملفات المحاضرة",medium:"متوسطة الثقة (استنتاج)",low:"منخفضة الثقة — راجع مفتاح المحاضِرة"};
const KEY = "coa_exam_quiz_v1";
let st = {};   // n -> {pick, checked}
try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { st = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  $("sTot").textContent = DATA.length;
  $("list").innerHTML = DATA.map(q => {
    const s = st[q.n] || {};
    const locked = !!s.checked;
    const opts = q.o.map(([l,t]) => {
      let cls = "o";
      if (s.pick === l) cls += " sel";
      if (locked && l === q.a) cls += " right";
      if (locked && s.pick === l && l !== q.a) cls += " wrong";
      return `<label class="${cls}"><input type="radio" name="q${q.n}" value="${l}" ${s.pick===l?"checked":""} ${locked?"disabled":""} data-n="${q.n}"><b>${l}</b><span>${esc(t)}</span></label>`;
    }).join("");
    let fb = "";
    if (locked) {
      const ok = s.pick === q.a;
      const ans = q.o.find(o => o[0] === q.a)[1];
      fb = `<div class="fb ${ok?"ok":"bad"}"><div class="t">${ok?"✓ إجابة صحيحة":"✗ إجابة خاطئة"} — الإجابة الصحيحة: <span dir="ltr">${q.a}. ${esc(ans)}</span></div>
      <div class="ex"><b>الشرح:</b> ${esc(q.x)}</div>
      ${q.f?`<div class="warn">${esc(q.f)}</div>`:""}
      <div class="meta">${CONFL[q.c]} · المرجع: ${esc(q.r)}</div></div>`;
    }
    return `<div class="q ${locked?"locked":""}" id="q${q.n}"><div class="qh"><span class="num">${q.n}</span><span>${esc(q.q)}</span></div>
    <div class="opts">${opts}</div>
    <div class="actions"><button data-chk="${q.n}" ${(!s.pick||locked)?"disabled":""}>تحقق</button></div>${fb}</div>`;
  }).join("");
  stats();
}
function stats(){
  let ans=0, chk=0, sc=0;
  DATA.forEach(q => { const s = st[q.n]||{}; if (s.pick) ans++; if (s.checked){ chk++; if (s.pick===q.a) sc++; } });
  $("sAns").textContent = ans; $("sChk").textContent = chk; $("sScore").textContent = sc; $("sChk2").textContent = chk;
  $("pr").style.width = (chk/DATA.length*100) + "%";
  const res = $("res");
  if (chk === DATA.length) {
    const pct = Math.round(sc/DATA.length*100);
    const wrong = DATA.filter(q => st[q.n].pick !== q.a).map(q => q.n);
    res.classList.remove("hidden");
    res.innerHTML = `<h2>النتيجة النهائية: ${sc} / ${DATA.length} (${pct}%)</h2>` + (wrong.length ? `<div>الأسئلة الخاطئة: ${wrong.join("، ")} — استخدم «إعادة محاولة الأخطاء».</div>` : "<div>ممتاز! كل الإجابات صحيحة.</div>");
  } else res.classList.add("hidden");
}
document.addEventListener("change", e => {
  const t = e.target; if (t.name && t.name.startsWith("q") && t.dataset.n) {
    const n = t.dataset.n; st[n] = Object.assign(st[n]||{}, {pick:t.value}); save(); render();
    const el = document.getElementById("q"+n); if (el) el.scrollIntoView({block:"nearest"});
  }
});
document.addEventListener("click", e => {
  const b = e.target.closest("button[data-chk]"); if (b) { const n=b.dataset.chk; if ((st[n]||{}).pick){ st[n].checked=true; save(); render(); const el=document.getElementById("q"+n); if(el) el.scrollIntoView({block:"nearest"}); } }
});
$("bAll").onclick = () => { DATA.forEach(q => { const s = st[q.n]; if (s && s.pick) s.checked = true; }); save(); render();
  const un = DATA.filter(q => !(st[q.n]||{}).pick).map(q=>q.n); if (un.length) alert("أسئلة لم تُجب بعد: " + un.join(", ")); };
$("bRetry").onclick = () => { DATA.forEach(q => { const s = st[q.n]; if (s && s.checked && s.pick !== q.a) delete st[q.n]; }); save(); render(); window.scrollTo({top:0,behavior:"smooth"}); };
$("bReset").onclick = () => { if (confirm("مسح كل الإجابات والنتيجة والبدء من جديد؟")) { st = {}; save(); render(); window.scrollTo({top:0}); } };
render();
</script></body></html>
