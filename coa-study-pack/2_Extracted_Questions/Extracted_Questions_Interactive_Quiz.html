", "t": "tf", "k": 7, "q": "DRAM is generally much faster than the processor, so memory is never a bottleneck.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "DRAM أبطأ بكثير من المعالج.", "n": "", "r": "المصدر: Ch2 notes §4", "s": 0}, {"id": 38, "sec": "Ch2: Performance Issues", "t": "tf", "k": 8, "q": "Making DRAM 'wider' rather than 'deeper' increases the number of bits retrieved at one time.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch2 notes §4", "s": 0}, {"id": 39, "sec": "Ch2: Performance Issues", "t": "tf", "k": 9, "q": "The overall balance of the system is more important than the raw performance of a single component.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch2 notes §4", "s": 0}, {"id": 40, "sec": "Ch2: Performance Issues", "t": "tf", "k": 10, "q": "In a multicore design the number of caches decreases as cores are added.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "عدد الـ caches يزداد ولهذا ظهرت مستويات cache.", "n": "", "r": "المصدر: Ch2 notes §6", "s": 0}, {"id": 41, "sec": "Ch2: Performance Issues", "t": "tf", "k": 11, "q": "MIC architectures feature a large number of homogeneous general-purpose processors on a single chip.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch2 notes §7", "s": 0}, {"id": 42, "sec": "Ch2: Performance Issues", "t": "tf", "k": 12, "q": "A GPU was traditionally designed for graphics processing.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch2 notes §8", "s": 0}, {"id": 43, "sec": "Ch2: Performance Issues", "t": "mcq", "k": 1, "q": "Which technique focuses on issuing multiple instructions simultaneously per clock cycle?", "o": [["A", "Data flow analysis"], ["B", "Superscalar execution"], ["C", "Superpipelining"], ["D", "Branch prediction"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch2 notes §3", "s": 0}, {"id": 44, "sec": "Ch2: Performance Issues", "t": "mcq", "k": 2, "q": "Pipelining is best compared to _________.", "o": [["A", "a faster clock only"], ["B", "a single worker doing every task"], ["C", "an assembly line"], ["D", "a larger cache"]], "a": "C", "x": "assembly line.", "n": "", "r": "المصدر: Ch2 notes §3", "s": 0}, {"id": 45, "sec": "Ch2: Performance Issues", "t": "mcq", "k": 3, "q": "Which is one of the three approaches to overcome the processor–memory speed imbalance?", "o": [["A", "Use narrower buses"], ["B", "Increase the interconnect bandwidth"], ["C", "Reduce the number of registers"], ["D", "Remove the cache"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch2 notes §4", "s": 0}, {"id": 46, "sec": "Ch2: Performance Issues", "t": "mcq", "k": 4, "q": "Increasing the number of bits retrieved at one time is achieved by making DRAMs _________.", "o": [["A", "deeper"], ["B", "smaller"], ["C", "wider"], ["D", "slower"]], "a": "C", "x": "", "n": "", "r": "المصدر: Ch2 notes §4", "s": 0}, {"id": 47, "sec": "Ch2: Performance Issues", "t": "mcq", "k": 5, "q": "Which is NOT a way to improve chip organization and architecture?", "o": [["A", "Graphics Processing Unit (GPU)"], ["B", "Reduce the number of gates"], ["C", "Multicore"], ["D", "Increase the size and speed of caches"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch2 notes §5", "s": 0}, {"id": 48, "sec": "Ch2: Performance Issues", "t": "mcq", "k": 6, "q": "As caches became larger, designers created _________.", "o": [["A", "only off-chip cache"], ["B", "no cache"], ["C", "two and then three levels of cache"], ["D", "one level of cache"]], "a": "C", "x": "", "n": "", "r": "المصدر: Ch2 notes §6", "s": 0}, {"id": 49, "sec": "Ch2: Performance Issues", "t": "mcq", "k": 7, "q": "The strategy of multicore is to use _________.", "o": [["A", "one very complex processor"], ["B", "two simpler processors on the chip instead of one complex processor"], ["C", "only GPUs"], ["D", "a bigger clock"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch2 notes §6", "s": 0}, {"id": 50, "sec": "Ch2: Performance Issues", "t": "fib", "k": 1, "q": "_________ analysis examines which instructions depend on each other's results to build an optimized schedule.", "o": [], "a": "Data flow", "x": "", "n": "", "r": "المصدر: Ch2 notes §3", "s": 0}, {"id": 51, "sec": "Ch2: Performance Issues", "t": "fib", "k": 2, "q": "The three approaches to the memory imbalance are: wider DRAM, reduce access frequency (cache), and increase the _________ bandwidth.", "o": [], "a": "interconnect", "x": "", "n": "", "r": "المصدر: Ch2 notes §4", "s": 0}, {"id": 52, "sec": "Ch2: Performance Issues", "t": "fib", "k": 3, "q": "Processor chips with a large number of homogeneous general-purpose cores are called _________ (abbreviation).", "o": [], "a": "MIC", "x": "Many Integrated Core.", "n": "", "r": "المصدر: Ch2 notes §7", "s": 0}, {"id": 53, "sec": "Ch2: Performance Issues", "t": "fib", "k": 4, "q": "Branch prediction, pipelining and superscalar execution are techniques used to speed up the _________.", "o": [], "a": "microprocessor", "x": "", "n": "", "r": "المصدر: Ch2 notes §2-3", "s": 0}, {"id": 54, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 1, "q": "The I/OAR register specifies a particular I/O device.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch3 notes §1", "s": 0}, {"id": 55, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 2, "q": "The four categories of computer actions are processor-memory, processor-I/O, data processing and control.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch3 notes §2", "s": 0}, {"id": 56, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 3, "q": "The instruction cycle state diagram has seven states.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "if, iod, oac, of, do, os, iac.", "n": "", "r": "المصدر: Ch3 notes §3", "s": 0}, {"id": 57, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 4, "q": "Operand address calculation appears twice in the instruction cycle diagram.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "مرة لجلب المعامل ومرة لتخزين النتيجة.", "n": "", "r": "المصدر: Ch3 notes §3", "s": 0}, {"id": 58, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 5, "q": "The interrupt check step is performed after the operand store.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch3 notes §4", "s": 0}, {"id": 59, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 6, "q": "A timer interrupt is generated by an I/O controller.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "Timer interrupt من مؤقّت داخل المعالج.", "n": "", "r": "المصدر: Ch3 notes §4", "s": 0}, {"id": 60, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 7, "q": "A power failure generates a hardware failure interrupt.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch3 notes §4", "s": 0}, {"id": 61, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 8, "q": "DMA relieves the processor of responsibility for the I/O exchange.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch3 notes §5", "s": 0}, {"id": 62, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 9, "q": "If two devices transmit on a bus during the same time period, their signals overlap and become garbled.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 63, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 10, "q": "The width of the data bus has no effect on system performance.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "عرض الـ data bus عامل رئيسي في الأداء.", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 64, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 11, "q": "Address lines are generally also used to address I/O ports.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 65, "sec": "Ch3: Function & Interconnection", "t": "tf", "k": 12, "q": "The Bus grant control line indicates that a pending interrupt has been recognized.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "هذه Interrupt ACK؛ Bus grant تعني أن الـ bus مُنِح لوحدة.", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 66, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 1, "q": "Which register contains the data to be written into memory or receives the data read from memory?", "o": [["A", "MAR"], ["B", "MBR"], ["C", "I/OAR"], ["D", "PC"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch3 notes §1", "s": 0}, {"id": 67, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 2, "q": "The state that analyzes the instruction to determine the type of operation and operands is _________.", "o": [["A", "instruction operation decoding"], ["B", "data operation"], ["C", "operand fetch"], ["D", "instruction fetch"]], "a": "A", "x": "iod.", "n": "", "r": "المصدر: Ch3 notes §3", "s": 0}, {"id": 68, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 3, "q": "Which state writes the result into memory or out to I/O?", "o": [["A", "instruction fetch"], ["B", "data operation"], ["C", "operand store"], ["D", "operand fetch"]], "a": "C", "x": "os.", "n": "", "r": "المصدر: Ch3 notes §3", "s": 0}, {"id": 69, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 4, "q": "An interrupt generated by division by zero belongs to the _________ class.", "o": [["A", "program"], ["B", "timer"], ["C", "I/O"], ["D", "hardware failure"]], "a": "A", "x": "", "n": "", "r": "المصدر: Ch3 notes §4", "s": 0}, {"id": 70, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 5, "q": "Which control line indicates that a module needs to gain control of the bus?", "o": [["A", "Bus request"], ["B", "Transfer ACK"], ["C", "Bus grant"], ["D", "Reset"]], "a": "A", "x": "", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 71, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 6, "q": "Which control line is used to synchronize operations?", "o": [["A", "Clock"], ["B", "Reset"], ["C", "Memory read"], ["D", "Interrupt request"]], "a": "A", "x": "", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 72, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 7, "q": "Which control line initializes all modules?", "o": [["A", "Clock"], ["B", "Transfer ACK"], ["C", "Bus grant"], ["D", "Reset"]], "a": "D", "x": "", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 73, "sec": "Ch3: Function & Interconnection", "t": "mcq", "k": 8, "q": "The number of lines of the data bus is called its _________.", "o": [["A", "length"], ["B", "width"], ["C", "speed"], ["D", "depth"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 74, "sec": "Ch3: Function & Interconnection", "t": "fib", "k": 1, "q": "The processor-controlled sequence 'if, iod, oac, of, do, os, iac' is the instruction _________ state diagram.", "o": [], "a": "cycle", "x": "", "n": "", "r": "المصدر: Ch3 notes §3", "s": 0}, {"id": 75, "sec": "Ch3: Function & Interconnection", "t": "fib", "k": 2, "q": "An interrupt is a signal that requests the processor to suspend its current execution and service the occurred interrupt, using an interrupt service _________.", "o": [], "a": "routine", "x": "ISR.", "n": "", "r": "المصدر: Ch3 notes §4", "s": 0}, {"id": 76, "sec": "Ch3: Function & Interconnection", "t": "fib", "k": 3, "q": "_________ memory access allows I/O exchanges to occur directly with memory without tying up the processor (abbreviation).", "o": [], "a": "DMA", "x": "Direct Memory Access.", "n": "", "r": "المصدر: Ch3 notes §5", "s": 0}, {"id": 77, "sec": "Ch3: Function & Interconnection", "t": "fib", "k": 4, "q": "The _________ line indicates that data have been accepted from or placed on the bus.", "o": [], "a": "Transfer ACK", "x": "", "n": "", "r": "المصدر: Ch3 notes §7", "s": 0}, {"id": 78, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 1, "q": "Internal memory is accessible by the processor via an I/O module.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "هذه External memory.", "n": "", "r": "المصدر: Ch4 notes §1", "s": 0}, {"id": 79, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 2, "q": "Sequential access has a variable access time that depends on the data location.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 80, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 3, "q": "Random access has an access time that is constant, independent of prior accesses.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 81, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 4, "q": "Disk access is an example of associative access.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "القرص = Direct access.", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 82, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 5, "q": "Cache is an example of associative access.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 83, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 6, "q": "Going down the memory hierarchy, cost per bit decreases and access time increases.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §3", "s": 0}, {"id": 84, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 7, "q": "Greater capacity of memory means faster access time.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "سعة أكبر = أبطأ.", "n": "", "r": "المصدر: Ch4 notes §3", "s": 0}, {"id": 85, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 8, "q": "Registers are managed by the compiler.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §5", "s": 0}, {"id": 86, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 9, "q": "Main memory is typically built from SRAM.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "الذاكرة الرئيسية DRAM والـ cache SRAM.", "n": "", "r": "المصدر: Ch4 notes §5", "s": 0}, {"id": 87, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 10, "q": "A disk cache is a buffer in main memory that holds data for the disk.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §4", "s": 0}, {"id": 88, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 11, "q": "External nonvolatile memory is also called secondary or auxiliary memory.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §3", "s": 0}, {"id": 89, "sec": "Ch4: Computer Memory System", "t": "tf", "k": 12, "q": "The unit of transfer of external memory is usually a block much larger than a word.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 90, "sec": "Ch4: Computer Memory System", "t": "mcq", "k": 1, "q": "Tape is an example of _________ access.", "o": [["A", "random"], ["B", "sequential"], ["C", "direct"], ["D", "associative"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 91, "sec": "Ch4: Computer Memory System", "t": "mcq", "k": 2, "q": "The smallest location that can be uniquely addressed is the _________.", "o": [["A", "page"], ["B", "block"], ["C", "addressable unit"], ["D", "sector"]], "a": "C", "x": "", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 92, "sec": "Ch4: Computer Memory System", "t": "mcq", "k": 3, "q": "The correct order of the hierarchy from fastest to slowest is _________.", "o": [["A", "Cache, registers, disk, main memory"], ["B", "Registers, on-chip cache, main memory, disk"], ["C", "Disk, main memory, cache, registers"], ["D", "Registers, main memory, cache, disk"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch4 notes §3", "s": 0}, {"id": 93, "sec": "Ch4: Computer Memory System", "t": "mcq", "k": 4, "q": "The unit of transfer of a magnetic disk (secondary memory) is a _________.", "o": [["A", "sector"], ["B", "word"], ["C", "cache block"], ["D", "register"]], "a": "A", "x": "512 bytes.", "n": "", "r": "المصدر: Ch4 notes §5", "s": 0}, {"id": 94, "sec": "Ch4: Computer Memory System", "t": "mcq", "k": 5, "q": "Which is managed by the operating system?", "o": [["A", "Registers"], ["B", "Cache"], ["C", "Main memory"], ["D", "None of the above"]], "a": "C", "x": "", "n": "", "r": "المصدر: Ch4 notes §5", "s": 0}, {"id": 95, "sec": "Ch4: Computer Memory System", "t": "mcq", "k": 6, "q": "The memory design questions are 'How much? How fast? How _________?'", "o": [["A", "big"], ["B", "expensive"], ["C", "wide"], ["D", "long"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch4 notes §3", "s": 0}, {"id": 96, "sec": "Ch4: Computer Memory System", "t": "fib", "k": 1, "q": "_________ access is based on a portion of the word's contents rather than its address.", "o": [], "a": "Associative", "x": "", "n": "", "r": "المصدر: Ch4 notes §2", "s": 0}, {"id": 97, "sec": "Ch4: Computer Memory System", "t": "fib", "k": 2, "q": "The faster the access time, the _________ the cost per bit.", "o": [], "a": "greater", "x": "", "n": "", "r": "المصدر: Ch4 notes §3", "s": 0}, {"id": 98, "sec": "Ch4: Computer Memory System", "t": "fib", "k": 3, "q": "Off-line bulk memory typically uses magnetic _________.", "o": [], "a": "tape", "x": "", "n": "", "r": "المصدر: Ch4 notes §5", "s": 0}, {"id": 99, "sec": "Ch4: Computer Memory System", "t": "fib", "k": 4, "q": "_________ memory is directly accessible by the processor (registers, cache, main memory).", "o": [], "a": "Internal", "x": "", "n": "", "r": "المصدر: Ch4 notes §1", "s": 0}, {"id": 100, "sec": "Ch5: Cache Memory", "t": "tf", "k": 1, "q": "The cache has far fewer lines than main memory has blocks.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch5 notes §1", "s": 0}, {"id": 101, "sec": "Ch5: Cache Memory", "t": "tf", "k": 2, "q": "Each cache line holds one block plus a Tag.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch5 notes §1", "s": 0}, {"id": 102, "sec": "Ch5: Cache Memory", "t": "tf", "k": 3, "q": "On a cache miss, loading the block into the cache line and delivering the word to the CPU happen in parallel.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch5 notes §2", "s": 0}, {"id": 103, "sec": "Ch5: Cache Memory", "t": "tf", "k": 4, "q": "A logical cache is placed between the MMU and main memory.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "هذا physical cache؛ الـ logical بين المعالج والـ MMU.", "n": "", "r": "المصدر: Ch5 notes §4", "s": 0}, {"id": 104, "sec": "Ch5: Cache Memory", "t": "tf", "k": 5, "q": "In direct mapping each main memory block can be loaded into only one possible cache line.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch5 notes §5.1", "s": 0}, {"id": 105, "sec": "Ch5: Cache Memory", "t": "tf", "k": 6, "q": "Direct mapping needs a replacement algorithm.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "لا يوجد خيار، فلا حاجة لخوارزمية.", "n": "", "r": "المصدر: Ch5 notes §6", "s": 0}, {"id": 106, "sec": "Ch5: Cache Memory", "t": "tf", "k": 7, "q": "In associative mapping the cache control logic examines every line's tag simultaneously.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch5 notes §5.2", "s": 0}, {"id": 107, "sec": "Ch5: Cache Memory", "t": "tf", "k": 8, "q": "In set associative mapping m = v × k, where v is the number of sets and k the lines per set.", "o": [["T", "True"], ["F", "False"]], "a": "T", "x": "", "n": "", "r": "المصدر: Ch5 notes §5.3", "s": 0}, {"id": 108, "sec": "Ch5: Cache Memory", "t": "tf", "k": 9, "q": "LRU replaces the block that has experienced the fewest references.", "o": [["T", "True"], ["F", "False"]], "a": "F", "x": "هذا LFU." ", "k": 4, "q": "The main disadvantage of write back is _________.", "o": [["A", "no cache coherence issue"], ["B", "low hit rate"], ["C", "complex circuitry"], ["D", "large memory traffic"]], "a": "C", "x": "", "n": "", "r": "المصدر: Ch5 notes §7", "s": 0}, {"id": 117, "sec": "Ch5: Cache Memory", "t": "mcq", "k": 5, "q": "Which replacement algorithm can be implemented with a counter associated with each line?", "o": [["A", "LRU"], ["B", "FIFO"], ["C", "LFU"], ["D", "Random"]], "a": "C", "x": "", "n": "", "r": "المصدر: Ch5 notes §6", "s": 0}, {"id": 118, "sec": "Ch5: Cache Memory", "t": "mcq", "k": 6, "q": "L1 cache is usually _________.", "o": [["A", "unified only"], ["B", "internal to the processor"], ["C", "external to the processor"], ["D", "larger than L2"]], "a": "B", "x": "", "n": "", "r": "المصدر: Ch5 notes §8", "s": 0}, {"id": 119, "sec": "Ch5: Cache Memory", "t": "mcq", "k": 7, "q": "The page table that translates virtual to physical addresses is managed by the _________.", "o": [["A", "disk"], ["B", "cache"], ["C", "OS"], ["D", "ALU"]], "a": "C", "x": "", "n": "", "r": "المصدر: Ch5 notes §4", "s": 0}, {"id": 120, "sec": "Ch5: Cache Memory", "t": "mcq", "k": 8, "q": "Which of these is an element of cache design?", "o": [["A", "Mapping function"], ["B", "Replacement algorithm"], ["C", "Write policy"], ["D", "All of the above"]], "a": "D", "x": "", "n": "", "r": "المصدر: Ch5 notes §3", "s": 0}, {"id": 121, "sec": "Ch5: Cache Memory", "t": "fib", "k": 1, "q": "In direct mapping, a block is placed in a line number computed as block number _____ m.", "o": [], "a": "mod", "x": "", "n": "", "r": "المصدر: Ch5 notes §5.1", "s": 0}, {"id": 122, "sec": "Ch5: Cache Memory", "t": "fib", "k": 2, "q": "A word found in the cache is called a _________.", "o": [], "a": "hit", "x": "", "n": "", "r": "المصدر: Ch5 notes §2", "s": 0}, {"id": 123, "sec": "Ch5: Cache Memory", "t": "fib", "k": 3, "q": "With _________ mapping any block can go into any line of the cache.", "o": [],   L.forEach(q => { const s = st[q.id]||{}; if (s.checked){ chk++; if (isRight(q,s)) sc++; } });
  $("sChk").textContent = chk; $("sScore").textContent = sc; $("sChk2").textContent = chk; $("pr").style.width = (L.length ? chk/L.length*100 : 0) + "%";
  const r = $("res"); if (L.length && chk === L.length) { r.classList.remove("hidden"); r.innerHTML = `<b>النتيجة النهائية للمعروض: ${sc} / ${L.length} (${Math.round(sc/L.length*100)}%)</b>`; } else r.classList.add("hidden"); }
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.id && t.type === "radio") { st[t.dataset.id] = Object.assign(st[t.dataset.id]||{}, {pick:t.value}); save(); render(); } });
document.addEventListener("input", e => { const t = e.target; if (t.dataset && t.dataset.id && t.type === "text") { st[t.dataset.id] = Object.assign(st[t.dataset.id]||{}, {pick:t.value}); save(); const b = document.querySelector(`[data-chk="${t.dataset.id}"]`); if (b) b.disabled = !t.value.trim(); } });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-chk]"); if (b) { const id = b.dataset.chk; if ((st[id]||{}).pick) { st[id].checked = true; save(); render(); } return; }
  const m = e.target.closest("[data-man]"); if (m) { st[m.dataset.man].manual = true; save(); render(); } });
["fSec","fType"].forEach(i => $(i).onchange = render);
$("bAll").onclick = () => { shown().forEach(q => { const s = st[q.id]; if (s && s.pick) s.checked = true; }); save(); render(); };
$("bRetry").onclick = () => { shown().forEach(q => { const s = st[q.id]; if (s && s.checked && !isRight(q,s)) delete st[q.id]; }); save(); render(); };
$("bReset").onclick = () => { if (confirm("مسح كل الإجابات والبدء من جديد؟")) { st = {}; save(); render(); } };
render();
</script></body></html>
